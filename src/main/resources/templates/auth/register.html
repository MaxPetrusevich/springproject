<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | Subscription Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(107, 115, 255, 0.25);
            border-color: #6B73FF;
        }
        .btn-primary {
            background: #6B73FF;
            border-color: #6B73FF;
        }
        .btn-primary:hover {
            background: #000DFF;
            border-color: #000DFF;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h2 class="text-center mb-4">Регистрация</h2>

        <form id="registerForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required>
                <div class="error-message" id="firstNameError"></div>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="lastName" name="lastName" required>
                <div class="error-message" id="lastNameError"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Тип аккаунта</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="role" id="roleUser" value="USER" checked>
                    <label class="form-check-label" for="roleUser">
                        Пользователь
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="role" id="roleOrganiser" value="ORGANISER">
                    <label class="form-check-label" for="roleOrganiser">
                        Организатор
                    </label>
                </div>
                <div class="error-message" id="roleError"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Подтверждение пароля</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <a href="/" class="btn btn-outline-secondary">На главную</a>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // Очищаем предыдущие ошибки
        document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

        // Проверяем совпадение паролей
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
            return;
        }

        const formData = {
            email: document.getElementById('email').value,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            password: password,
            confirmPassword: confirmPassword,
            role: document.querySelector('input[name="role"]:checked').value
        };

        fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(() => {
                document.getElementById('registerForm').style.display = 'none';
                showVerificationForm(formData.email);
            })
            .catch(error => {
                if (error && error.errors) {
                    Object.entries(error.errors).forEach(([key, value]) => {
                        const errorElement = document.getElementById(${key}Error);
                        if (errorElement) {
                            errorElement.textContent = value;
                        }
                    });
                } else {
                    const errorMessage = encodeURIComponent(error.message || 'Произошла неизвестная ошибка');
                    window.location.href = /error?message=${errorMessage};
                }
            });
    });
    function showVerificationForm(email) {
        if (!email) {
            alert('Ошибка: Email для подтверждения не передан.');
            return;
        }

        const verificationHtml =
            <h3 class="text-center mb-4">Подтверждение Email</h3>
        <p class="text-center">Мы отправили код подтверждения на ${email}</p>
        <form id="verificationForm">
            <div class="mb-3">
                <label for="verificationCode" class="form-label">Код подтверждения</label>
                <input type="text" class="form-control" id="verificationCode" required>
                    <div class="error-message" id="verificationError"></div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Подтвердить</button>
                <a href="/" class="btn btn-outline-secondary">На главную</a>
            </div>
        </form>
    ;

    const container = document.querySelector('.login-card');
    if (!container) {
        console.error('Ошибка: контейнер для формы подтверждения не найден.');
        return;
    }

    // Заменяем содержимое контейнера на форму подтверждения
    container.innerHTML = verificationHtml;

    document.getElementById('verificationForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const verificationData = {
            email: email,
            verificationCode: document.getElementById('verificationCode').value
        };

        fetch('/api/auth/verify-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(verificationData)
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(data => {
                if (data) {

                    const role = data.role;
                    console.log(role);
                    if (role === 'ORGANIZER') {
                        window.location.href = '/organiser/dashboard';
                    } else if (role === 'USER') {
                        window.location.href = '/customer/products';
                    } else {
                        throw new Error('Неизвестная роль пользователя');
                    }
                } else {
                    throw new Error('Некорректный ответ сервера');
                }
            })
            .catch(error => {
                const errorMessage = error.message || 'Ошибка подтверждения кода';
                document.getElementById('verificationError').textContent = errorMessage;
                console.error('Ошибка подтверждения:', error);
            });
    });
    }

</script>

</body>
</html>
