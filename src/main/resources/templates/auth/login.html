<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход | Subscription Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(107, 115, 255, 0.25);
            border-color: #6B73FF;
        }
        .btn-primary {
            background: #6B73FF;
            border-color: #6B73FF;
        }
        .btn-primary:hover {
            background: #000DFF;
            border-color: #000DFF;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h2 class="text-center mb-4">Вход в систему</h2>

        <div th:if="${param.error}" class="alert alert-danger">
            Неверный email или пароль
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Вы успешно вышли из системы
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Войти</button>
                <a href="/" class="btn btn-outline-secondary">На главную</a>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/register" class="text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async function (event) {
        event.preventDefault(); // Отключаем стандартное поведение формы

        // Получаем данные формы
        // Получение email и password из формы
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        console.log('Email:', email);  // Логирование email перед отправкой
        console.log('Password:', password);  // Логирование password перед отправкой
        console.log(JSON.stringify({ email, password }));
        try {
            // Отправляем запрос на сервер
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json(); // Парсим JSON-ответ
                console.log(data.message); // Для отладки: выводим сообщение в консоль

                // Перенаправляем пользователя на указанный URL
                window.location.href = data.redirectUrl;
            } else {
                // Если запрос не удался, выводим сообщение об ошибке
                const errorData = await response.json();
                alert(errorData.message || 'Ошибка входа. Проверьте данные.');
            }
        } catch (error) {
            // Обрабатываем ошибки сети или серверные ошибки
            console.error('Ошибка:', error);
            alert('Произошла неожиданная ошибка. Попробуйте снова.');
        }
    });

</script>
</body>
</html>
