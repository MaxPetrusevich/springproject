<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Панель организатора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div th:fragment="layout(content)" id="wrapper">
        <!-- Навигация -->
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/organiser/dashboard}">
                    <i class="bi bi-building me-2"></i>Панель организатора
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Основное меню -->
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/organiser/dashboard}"
                               th:classappend="${#httpServletRequest.requestURI == '/organiser/dashboard' ? 'active' : ''}">
                                <i class="bi bi-speedometer2"></i> Дашборд
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/organiser/organisations}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/organiser/organisations') ? 'active' : ''}">
                                <i class="bi bi-building"></i> Мои организации
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/organiser/products}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/organiser/products') ? 'active' : ''}">
                                <i class="bi bi-box"></i> Продукты
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/organiser/subscription-plans}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/organiser/subscription-plans') ? 'active' : ''}">
                                <i class="bi bi-list-check"></i> Планы подписок
                            </a>
                        </li>
                    </ul>

                    <!-- Правая часть навигации -->
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/organiser/profile}">
                                <i class="bi bi-person"></i> Профиль
                            </a>
                        </li>
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn nav-link text-danger border-0">
                                    <i class="bi bi-box-arrow-right"></i> Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Основной контент -->
        <div class="container-fluid py-4">
            <th:block th:replace="${content}">
                <!-- Page content goes here -->
            </th:block>
        </div>

        <!-- Footer -->
        <footer class="sticky-footer bg-white mt-auto">
            <div class="container">
                <div class="copyright text-center">
                    <span>Copyright &copy; Subscription Management</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
