<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    <style>
        /* Стили для таблиц и кнопок */
        .table .action-buttons {
            display: flex;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .table .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .table .btn i {
            font-size: 1rem;
        }

        /* Стили для фильтров */
        .filters-card {
            margin-bottom: 1.5rem;
        }

        .filters-card .card-body {
            padding: 1rem;
        }

        .filters-form {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .filters-form .form-group {
            flex: 1;
        }

        /* Стили для статусов */
        .badge {
            padding: 0.35em 0.65em;
            font-size: 0.75em;
            font-weight: 500;
        }

        .badge-success {
            background-color: #28a745;
            color: white;
        }

        .badge-danger {
            background-color: #dc3545;
            color: white;
        }

        .badge-warning {
            background-color: #ffc107;
            color: black;
        }

        /* Стили для кнопок фильтрации */
        .filters-form .btn {
            height: 38px;  /* Высота как у input */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.375rem 0.75rem;
        }

        .filters-form .btn i {
            font-size: 1rem;
            margin-right: 0;
        }

        /* Стили для кнопок в таблицах организаций */
        .table .action-buttons {
            display: flex;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .table .action-buttons .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .table .action-buttons .btn i {
            font-size: 1rem;
        }

        /* Стили для кнопок фильтрации */
        .card-body .btn {
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .card-body .btn i {
            font-size: 1rem;
        }

        /* Стили для форм фильтрации */
        .card-body form .col-md-1 .btn {
            width: 100%;
            padding: 0.375rem 0.75rem;
        }
    </style>
</head>
<body>
    <div th:fragment="layout(content)">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/admin/dashboard}">
                    <i class="bi bi-gear-fill me-2"></i>Админ-панель
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Основное меню -->
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}" 
                               th:classappend="${#httpServletRequest.requestURI == '/admin/dashboard' ? 'active' : ''}">
                                <i class="bi bi-speedometer2"></i> Дашборд
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/users') ? 'active' : ''}">
                                <i class="bi bi-people"></i> Пользователи
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/organisations}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/organisations') ? 'active' : ''}">
                                <i class="bi bi-building"></i> Организации
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/products') ? 'active' : ''}">
                                <i class="bi bi-box"></i> Продукты
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/subscription-plans}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/subscription-plans') ? 'active' : ''}">
                                <i class="bi bi-list-check"></i> Планы подписок
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/subscriptions}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/subscriptions') ? 'active' : ''}">
                                <i class="bi bi-card-checklist"></i> Подписки
                            </a>
                        </li>
                    </ul>

                    <!-- Правая часть навигации -->
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle"></i>
                                <span sec:authentication="name">Админ</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item">
                                            <i class="bi bi-box-arrow-right"></i> Выход
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="container-fluid">
            <th:block th:replace="${content}">
                <!-- Page content goes here -->
            </th:block>
        </div>

        <!-- Footer -->
        <footer class="footer mt-auto py-3 bg-light">
            <div class="container text-center">
                <span class="text-muted">© 2024 Subscription Management</span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <th:block th:fragment="scripts">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- Bootstrap Bundle JS (включает Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- DataTables -->
        <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap5.min.js"></script>
        <!-- Custom JS -->
        <script th:src="@{/js/main.js}"></script>
        <script th:src="@{/js/admin.js}"></script>
        <script th:src="@{/js/admin/common.js}"></script>
    </th:block>
</body>
</html>
