<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
    <div th:fragment="layout(content)">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/admin/dashboard}">
                    <i class="bi bi-gear-fill me-2"></i>Админ-панель
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Основное меню -->
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}" 
                               th:classappend="${#httpServletRequest.requestURI == '/admin/dashboard' ? 'active' : ''}">
                                <i class="bi bi-speedometer2"></i> Дашборд
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/users') ? 'active' : ''}">
                                <i class="bi bi-people"></i> Пользователи
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/organisations}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/organisations') ? 'active' : ''}">
                                <i class="bi bi-building"></i> Организации
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/products') ? 'active' : ''}">
                                <i class="bi bi-box"></i> Продукты
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/subscription-plans}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/subscription-plans') ? 'active' : ''}">
                                <i class="bi bi-list-check"></i> Планы подписок
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/subscriptions}"
                               th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/subscriptions') ? 'active' : ''}">
                                <i class="bi bi-card-checklist"></i> Подписки
                            </a>
                        </li>
                    </ul>

                    <!-- Правая часть навигации -->
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle"></i>
                                <span th:text="${#authentication.name}">Username</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li sec:authorize="!hasRole('ADMIN')">
                                    <a class="dropdown-item" th:href="@{/admin/profile}">
                                        <i class="bi bi-person me-2"></i>Профиль
                                    </a>
                                </li>
                                <li sec:authorize="!hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="bi bi-box-arrow-right me-2"></i>Выйти
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="container-fluid">
            <th:block th:replace="${content}">
                <!-- Page content goes here -->
            </th:block>
        </div>

        <!-- Footer -->
        <footer class="footer mt-auto py-3 bg-light">
            <div class="container text-center">
                <span class="text-muted">© 2024 Subscription Management</span>
            </div>
        </footer>

        <!-- Scripts -->
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- Bootstrap Bundle JS (включает Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- Custom JS -->
        <script th:src="@{/js/main.js}"></script>
        <script th:src="@{/js/admin.js}"></script>
        <script th:src="@{/js/admin/common.js}"></script>
    </div>
</body>
</html>
