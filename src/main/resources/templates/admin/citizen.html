<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="admin/layout :: html(content=~{::content})">
<body>
    <div th:fragment="content">
        <h2>Управление гражданами</h2>
        
        <!-- Форма поиска -->
        <form class="search-form row g-3" method="get" th:action="@{/admin/citizens}">
            <div class="col-md-2">
                <input type="text" class="form-control" name="lastName" 
                       th:value="${param.lastName}" placeholder="Фамилия">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" name="firstName" 
                       th:value="${param.firstName}" placeholder="Имя">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" name="identifyNumber" 
                       th:value="${param.identifyNumber}" placeholder="ИИН">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" name="phone" 
                       th:value="${param.phone}" placeholder="Телефон">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Поиск</button>
            </div>
            <div class="col-md-2">
                <a th:href="@{/admin/citizens/create}" class="btn btn-success w-100">
                    <i class="bi bi-plus-lg"></i> Добавить гражданина
                </a>
            </div>
        </form>

        <!-- Таблица граждан -->
        <div class="table-responsive mt-3">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>ИИН</th>
                        <th>Паспортные данные</th>
                        <th>Контакты</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${citizens == null || #lists.isEmpty(citizens.content)}">
                        <td colspan="6" class="text-center">Граждане не найдены</td>
                    </tr>
                    <tr th:each="citizen : ${citizens.content}" th:if="${citizen != null}">
                        <td th:text="${citizen.id}">1</td>
                        <td>
                            <div th:text="${(citizen.lastName ?: '') + ' ' + (citizen.firstName ?: '')}">
                                Фамилия Имя
                            </div>
                            <small th:text="${citizen.middleName ?: ''}">Отчество</small>
                        </td>
                        <td th:text="${citizen.identifyNumber ?: '-'}">000000000000</td>
                        <td>
                            <div th:text="${'Серия: ' + (citizen.passportSeries ?: '-')}">Серия: AA</div>
                            <div th:text="${'Номер: ' + (citizen.passportNumber ?: '-')}">Номер: 0000000</div>
                        </td>
                        <td>
                            <div th:text="${citizen.phone ?: '-'}">+7(000)000-00-00</div>
                            <div th:text="${citizen.email ?: '-'}">email@example.com</div>
                        </td>
                        <td class="action-buttons">
                            <a th:href="@{/admin/citizens/{id}/edit(id=${citizen.id})}" 
                               class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/citizens/{id}/bids(id=${citizen.id})}" 
                               class="btn btn-info btn-sm">
                                <i class="bi bi-list-ul"></i>
                            </a>
                            <form th:action="@{/admin/citizens/{id}(id=${citizen.id})}" 
                                  method="post" style="display: inline;">
                                <input type="hidden" name="_method" value="DELETE">
                                <button type="submit" class="btn btn-danger btn-sm" 
                                        onclick="return confirm('Вы уверены? Это действие удалит все связанные заявки.')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Пагинация -->
        <div th:replace="fragments/pagination :: pagination(${citizens})"></div>
    </div>
</body>
</html>
