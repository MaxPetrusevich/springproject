<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Подписки</title>
    <style>
        .table .btn-group {
            display: flex;
            gap: 4px;
        }
        
        .table .btn {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            font-size: 14px;
            line-height: 1;
        }
        
        .table .btn i {
            margin-right: 4px;
        }
        
        .filter-panel {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .filter-panel .btn {
            margin-right: 8px;
        }
        
        .filter-panel .form-group {
            margin-bottom: 16px;
        }
        
        /* Специфичные стили для статусов */
        .badge {
            padding: 4px 8px;
            font-size: 12px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Подписки</h1>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="status">
                                <option value="">Все статусы</option>
                                <option th:each="stat : ${statuses}"
                                        th:value="${stat}"
                                        th:text="${stat}"
                                        th:selected="${stat == selectedStatus}">
                                    Статус
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="userId">
                                <option value="">Все пользователи</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.email}"
                                        th:selected="${user.id == selectedUser}">
                                    Пользователь
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" name="productId">
                                <option value="">Все продукты</option>
                                <option th:each="product : ${products}"
                                        th:value="${product.id}"
                                        th:text="${product.name}"
                                        th:selected="${product.id == selectedProduct}">
                                    Продукт
                                </option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Subscriptions List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Пользователь</th>
                                    <th>Продукт</th>
                                    <th>План</th>
                                    <th>Статус</th>
                                    <th>Начало</th>
                                    <th>Окончание</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="subscription : ${subscriptions}">
                                    <td th:text="${subscription.id}"></td>
                                    <td>
                                        <a th:if="${subscription.userId != null}" 
                                           th:href="@{/admin/users/{id}(id=${subscription.userId})}" 
                                           th:text="${subscription.userEmail}">
                                            Email пользователя
                                        </a>
                                        <span th:unless="${subscription.userId != null}">-</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/products/{id}(id=${subscription.productId})}" 
                                           th:text="${subscription.productName}"></a>
                                    </td>
                                    <td th:text="${subscription.planName}"></td>
                                    <td>
                                     <span th:class="${'badge ' + 
                                          (subscription.status == 'ACTIVE' ? 'badge-success' : 
                                          (subscription.status == 'EXPIRED' ? 'badge-warning' : 
                                          (subscription.status == 'CANCELLED' ? 'badge-danger' : 'badge-secondary')))}"
                                        th:text="${subscription.status == 'ACTIVE' ? 'Активна' :
                                                 (subscription.status == 'EXPIRED' ? 'Завершена' :
                                                 (subscription.status == 'CANCELLED' ? 'Отменена' : subscription.status))}">
                                     </span>
                                    </td>

                                    <td th:text="${#temporals.format(subscription.startDate, 'dd.MM.yyyy')}"></td>
                                    <td th:text="${#temporals.format(subscription.endDate, 'dd.MM.yyyy')}"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/subscriptions/{id}(id=${subscription.id})}" 
                                               class="btn btn-primary">
                                                <i class="bi bi-eye"></i>
                                                <span>Просмотр</span>
                                            </a>
                                            <!-- Кнопка отмены для активных подписок -->
                                            <form th:if="${subscription.status == 'ACTIVE'}" 
                                                  onsubmit="handleTableAction(event, 
                                                            '/api/admin/subscriptions/' + [[${subscription.id}]] + '/cancel', 
                                                            'POST', 
                                                            'Вы уверены, что хотите отменить эту подписку?')" 
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-danger">
                                                    <i class="bi bi-x-circle"></i>
                                                    <span>Отменить</span>
                                                </button>
                                            </form>
                                            <!-- Кнопка возобновления для отмененных и истекших подписок -->
                                            <form th:if="${subscription.status == 'CANCELLED' || subscription.status == 'EXPIRED'}" 
                                                  th:action="@{/admin/subscriptions/{id}/renew(id=${subscription.id})}" 
                                                  method="post"
                                                  onsubmit="return confirm('Вы уверены, что хотите возобновить эту подписку?')"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-success">
                                                    <i class="bi bi-arrow-clockwise"></i>
                                                    <span>Возобновить</span>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(subscriptions)}">
                                    <td colspan="8" class="text-center">Подписки не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/subscriptions.js}"></script>
</body>
</html>
