<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="admin/layout :: html(~{::content})">
<body>
    <div th:fragment="content">
        <!-- Hero секция -->
        <div class="bg-primary text-white py-4 mb-4">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-2">
                                <li class="breadcrumb-item">
                                    <a th:href="@{/admin/establishments}" class="text-white-50">Учреждения</a>
                                </li>
                                <li class="breadcrumb-item active text-white">
                                    <span th:text="${establishment.id != null ? 'Редактирование' : 'Новое учреждение'}">
                                        Редактирование
                                    </span>
                                </li>
                            </ol>
                        </nav>
                        <h1 class="display-5 mb-0">
                            <i class="bi bi-building"></i>
                            <span th:text="${establishment.id != null ? 'Редактирование учреждения' : 'Новое учреждение'}">
                                Учреждение
                            </span>
                        </h1>
                    </div>
                    <div class="col-auto">
                        <a th:href="@{/admin/establishments}" class="btn btn-lg btn-light">
                            <i class="bi bi-arrow-left"></i> К списку учреждений
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid">
            <div class="row">
                <!-- Основная форма -->
                <div class="col-lg-8">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-building"></i> Данные учреждения
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="${establishment.id != null ? '/admin/establishments/' + establishment.id : '/admin/establishments'}"
                                  method="post"
                                  class="needs-validation"
                                  novalidate>
                                
                                <!-- Название -->
                                <div class="mb-3">
                                    <label class="form-label">Название</label>
                                    <input type="text" 
                                           class="form-control" 
                                           name="name"
                                           th:value="${establishment.name}"
                                           required>
                                    <div class="invalid-feedback">
                                        Введите название учреждения
                                    </div>
                                </div>

                                <!-- Адрес -->
                                <div class="mb-3">
                                    <label class="form-label">Адрес</label>
                                    <input type="text" 
                                           class="form-control" 
                                           name="address"
                                           th:value="${establishment.address}"
                                           required>
                                    <div class="invalid-feedback">
                                        Введите адрес учреждения
                                    </div>
                                </div>

                                <!-- Телефон -->
                                <div class="mb-3">
                                    <label class="form-label">Телефон</label>
                                    <input type="tel" 
                                           class="form-control" 
                                           name="phone"
                                           th:value="${establishment.phone}"
                                           pattern="^\+375\(\d{2}\)\d{3}-\d{2}-\d{2}$"
                                           placeholder="+375(XX)XXX-XX-XX"
                                           required>
                                    <div class="invalid-feedback">
                                        Введите телефон в формате +375(XX)XXX-XX-XX
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" 
                                           class="form-control" 
                                           name="email"
                                           th:value="${establishment.email}"
                                           required>
                                    <div class="invalid-feedback">
                                        Введите корректный email
                                    </div>
                                </div>

                                <!-- Описание -->
                                <div class="mb-3">
                                    <label class="form-label">Описание</label>
                                    <textarea class="form-control" 
                                              name="description" 
                                              rows="5"
                                              th:text="${establishment.description}"></textarea>
                                </div>

                                <!-- Кнопки -->
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/establishments}" class="btn btn-light">
                                        <i class="bi bi-x-lg"></i> Отмена
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg"></i> Сохранить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Боковая панель -->
                <div class="col-lg-4">
                    <!-- Список услуг -->
                    <div class="card shadow-sm" th:if="${establishment.id != null and not #lists.isEmpty(establishment.services)}">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-gear"></i> Услуги
                            </h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="list-group list-group-flush">
                                <a th:each="service : ${establishment.services}"
                                   th:href="@{/admin/services/{id}(id=${service.id})}"
                                   class="list-group-item list-group-item-action">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span th:text="${service.name}">Услуга</span>
                                        <span class="badge bg-primary" 
                                              th:text="${service.category.category}">
                                            Категория
                                        </span>
                                    </div>
                                    <small class="text-muted">
                                        <i class="bi bi-file-text"></i>
                                        <span th:text="${#lists.size(service.bids) + ' заявок'}">0 заявок</span>
                                    </small>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JavaScript -->
        <script>
            // Валидация формы
            (function() {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms)
                    .forEach(function(form) {
                        form.addEventListener('submit', function(event) {
                            if (!form.checkValidity()) {
                                event.preventDefault()
                                event.stopPropagation()
                            }
                            form.classList.add('was-validated')
                        }, false)
                    })
            })()

            // Маска для телефона
            var phoneInput = document.querySelector('input[type="tel"]')
            phoneInput.addEventListener('input', function(e) {
                var x = e.target.value.replace(/\D/g, '')
                    .match(/(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/)
                if (!x[2]) return
                e.target.value = '+375(' + x[1] + ')' + x[2] + 
                    (x[3] ? '-' + x[3] : '') + 
                    (x[4] ? '-' + x[4] : '')
            })
        </script>
    </div>
</body>
</html>
