<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="admin/layout :: html(content=~{::content})">
<body>
    <div th:fragment="content">
        <h2 th:text="${payment.id == null ? 'Новый платеж' : 'Редактирование платежа'}">
            Платеж
        </h2>

        <form th:action="@{${payment.id == null ? '/admin/payments' : '/admin/payments/' + payment.id}}"
              th:object="${payment}" method="post" class="needs-validation" novalidate>
            
            <input type="hidden" name="_method" th:value="${payment.id == null ? 'POST' : 'PUT'}" />

            <!-- Выбор заявки -->
            <div class="mb-3">
                <label for="bid" class="form-label">Заявка</label>
                <select class="form-select" id="bid" th:field="*{bidId}" required>
                    <option value="">Выберите заявку</option>
                    <option th:each="bid : ${bids}"
                            th:if="${bid != null}"
                            th:value="${bid.id}"
                            th:text="${'Заявка #' + bid.id + 
                                     (bid.citizen != null ? ' - ' + 
                                      (bid.citizen.lastName ?: '') + ' ' + 
                                      (bid.citizen.firstName ?: '') : '')}">
                    </option>
                </select>
                <div class="invalid-feedback">
                    Пожалуйста, выберите заявку
                </div>
            </div>

            <!-- Сумма платежа -->
            <div class="mb-3">
                <label for="sum" class="form-label">Сумма платежа</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="sum" 
                           th:field="*{amount}" step="0.01" required
                           th:value="${payment.sum != null ? payment.sum : 0}">
                    <span class="input-group-text">₸</span>
                </div>
                <div class="invalid-feedback">
                    Пожалуйста, введите сумму платежа
                </div>
            </div>

            <!-- Дата платежа -->
            <div class="mb-3">
                <label for="date" class="form-label">Дата платежа</label>
                <input type="date" class="form-control" id="date" 
                       th:field="*{paymentDate}" required>
                <div class="invalid-feedback">
                    Пожалуйста, укажите дату платежа
                </div>
            </div>

            <!-- Статус платежа -->
            <div class="mb-3">
                <label for="status" class="form-label">Статус платежа</label>
                <select class="form-select" id="status" th:field="*{statusId}" required>
                    <option value="">Выберите статус</option>
                    <option th:each="status : ${paymentStatuses}"
                            th:if="${status != null}"
                            th:value="${status.id}"
                            th:text="${status.status ?: 'Неизвестный статус'}">
                    </option>
                </select>
                <div class="invalid-feedback">
                    Пожалуйста, выберите статус платежа
                </div>
            </div>

            <!-- Кнопки -->
            <div class="mb-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a th:href="@{/admin/payments}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>

    <!-- Скрипт для валидации формы -->
    <script th:inline="javascript">
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
</body>
</html>
