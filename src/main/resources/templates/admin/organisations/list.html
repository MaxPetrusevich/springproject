<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Организации</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Организации</h1>
                <a href="/admin/organisations/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50"></i> Создать организацию
                </a>
            </div>

            <!-- Content Row -->
            <div class="row">
                <div class="col-12">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Список организаций</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Название</th>
                                        <th>Описание</th>
                                        <th>Статус</th>
                                        <th>Подписчики</th>
                                        <th>Действия</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="organisation : ${organisations}">
                                        <td th:text="${organisation.id}"></td>
                                        <td th:text="${organisation.name}"></td>
                                        <td th:text="${organisation.description}"></td>
                                        <td>
                                            <span th:class="${'badge ' + 
                                                (organisation.active ? 'bg-success text-white' : 'bg-danger text-white')}"
                                                th:text="${organisation.active ? 'Активна' : 'Заблокирована'}">
                                            </span>
                                        </td>
                                        <td th:text="${organisation.subscribersCount}"></td>
                                        <td>
                                            <div class="action-buttons">
                                                <a th:href="@{/admin/organisations/{id}(id=${organisation.id})}" 
                                                    class="btn btn-primary">
                                                    <i class="bi bi-eye me-1"></i>
                                                    <span>Просмотр</span>
                                                </a>
                                                <button type="button" class="btn"
                                                    th:classappend="${organisation.active ? 'btn-danger' : 'btn-success'}"
                                                    th:onclick="'toggleOrganisationStatus(' + ${organisation.id} + ')'">
                                                    <i class="bi" 
                                                        th:classappend="${organisation.active ? 'bi-lock me-1' : 'bi-unlock me-1'}">
                                                    </i>
                                                    <span th:text="${organisation.active ? 'Заблокировать' : 'Разблокировать'}">
                                                    </span>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(organisations)}">
                                        <td colspan="6" class="text-center">Организации не найдены</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/organisations.js}"></script>
</body>
</html>
