<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Организации</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Организации</h1>
                <a href="/admin/organisations/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50"></i> Создать организацию
                </a>
            </div>

            <!-- Content Row -->
            <div class="row">
                <div class="col-12">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Список организаций</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Название</th>
                                        <th>Описание</th>
                                        <th>Статус</th>
                                        <th>Подписчики</th>
                                        <th>Действия</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="organis : ${organisations}">
                                        <td th:text="${organis.id}"></td>
                                        <td th:text="${organis.name}"></td>
                                        <td th:text="${organis.description}"></td>
                                        <td>
                                            <span th:if="${organis.active}" class="badge badge-success">Активна</span>
                                            <span th:unless="${organis.active}" class="badge badge-danger">Неактивна</span>
                                        </td>
                                        <td th:text="${organis.subscribersCount}"></td>
                                        <td>
                                            <div class="action-buttons">
                                                <a th:href="@{/admin/organisations/{id}/edit(id=${organis.id})}" 
                                                   class="btn btn-warning">
                                                    <i class="bi bi-pencil"></i>
                                                    <span>Изменить</span>
                                                </a>
                                                <form th:action="@{/api/admin/organisations/{id}/toggle(id=${organis.id})}" 
                                                      onsubmit="handleTableAction(event, 
                                                        '/api/admin/organisations/' + [[${organis.id}]] + '/toggle', 
                                                        'POST', 
                                                        'Вы уверены, что хотите изменить статус организации?')" 
                                                      style="display: inline;">
                                                    <button type="submit" class="btn btn-danger">
                                                        <i class="bi bi-power"></i>
                                                        <span th:text="${organis.active ? 'Деактивировать' : 'Активировать'}">Статус</span>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(organisations)}">
                                        <td colspan="6" class="text-center">Организации не найдены</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/organisations.js}"></script>
</body>
</html>
