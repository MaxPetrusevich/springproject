<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Просмотр организации</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" th:text="${organisation.name}">Организация</h1>
                <div class="btn-group">
                    <a th:href="@{/admin/organisations/{id}/edit(id=${organisation.id})}" 
                       class="btn btn-warning">
                        <i class="bi bi-pencil me-1"></i>
                        <span>Редактировать</span>
                    </a>
                    <button type="button" class="btn"
                            th:classappend="${organisation.active ? 'btn-danger' : 'btn-success'}"
                            th:onclick="'toggleOrganisationStatus(' + ${organisation.id} + ')'"
                            title="Изменить статус">
                        <i class="bi" th:classappend="${organisation.active ? 'bi-toggle-off me-1' : 'bi-toggle-on me-1'}"></i>
                        <span th:text="${organisation.active ? 'Деактивировать' : 'Активировать'}"></span>
                    </button>
                </div>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Основная информация -->
                <div class="col-xl-6 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-4">Владелец</dt>
                                <dd class="col-sm-8">
                                    <a th:href="@{/admin/users/{id}(id=${organisation.ownerId})}"
                                       th:text="${organisation.ownerName}"></a>
                                </dd>

                                <dt class="col-sm-4">Описание</dt>
                                <dd class="col-sm-8" th:text="${organisation.description}"></dd>

                                <dt class="col-sm-4">Статус</dt>
                                <dd class="col-sm-8">
                                    <span class="badge"
                                          th:classappend="${organisation.active ? 'bg-success' : 'bg-danger'}"
                                          th:text="${organisation.active ? 'Активна' : 'Неактивна'}">
                                    </span>
                                </dd>

                                <dt class="col-sm-4">Создана</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(organisation.createdAt, 'dd.MM.yyyy')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="col-xl-6 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-8">Всего продуктов</dt>
                                <dd class="col-sm-4" th:text="${organisation.productsCount}"></dd>

                                <dt class="col-sm-8">Активных продуктов</dt>
                                <dd class="col-sm-4" th:text="${organisation.activeProductsCount}"></dd>

                                <dt class="col-sm-8">Активных подписок</dt>
                                <dd class="col-sm-4" th:text="${organisation.activeSubscriptionsCount}"></dd>

                                <dt class="col-sm-8">Всего подписок</dt>
                                <dd class="col-sm-4" th:text="${organisation.totalSubscriptionsCount}"></dd>

                                <dt class="col-sm-8">Доход за месяц</dt>
                                <dd class="col-sm-4" th:text="${#numbers.formatDecimal(organisation.monthlyIncome, 1, 'COMMA', 2, 'POINT') + ' ₽'}"></dd>

                                <dt class="col-sm-8">Общий доход</dt>
                                <dd class="col-sm-4" th:text="${#numbers.formatDecimal(organisation.totalIncome, 1, 'COMMA', 2, 'POINT') + ' ₽'}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Список продуктов -->
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Продукты</h6>
                    <a th:href="@{/admin/products/create(organisationId=${organisation.id})}" 
                       class="btn btn-primary btn-sm">
                        <i class="bi bi-plus me-1"></i>
                        <span>Добавить продукт</span>
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Планов</th>
                                    <th>Подписок</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td>
                                        <a th:href="@{/admin/products/{id}(id=${product.id})}" 
                                           th:text="${product.name}"></a>
                                    </td>
                                    <td th:text="${product.description}"></td>
                                    <td th:text="${product.subscriptionPlansCount}"></td>
                                    <td th:text="${product.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${product.active ? 'bg-success' : 'bg-danger'}"
                                              th:text="${product.active ? 'Активен' : 'Неактивен'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" 
                                               class="btn btn-warning btn-sm">
                                                <i class="bi bi-pencil me-1"></i>
                                                <span>Редактировать</span>
                                            </a>
                                            <button type="button" class="btn btn-sm"
                                                    th:classappend="${product.active ? 'btn-danger' : 'btn-success'}"
                                                    th:onclick="'toggleProductStatus(' + ${product.id} + ')'"
                                                    title="Изменить статус">
                                                <i class="bi" th:classappend="${product.active ? 'bi-toggle-off me-1' : 'bi-toggle-on me-1'}"></i>
                                                <span th:text="${product.active ? 'Деактивировать' : 'Активировать'}"></span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="6" class="text-center">Продукты не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/organisations.js}"></script>
</body>
</html>
