<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Просмотр организации</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" th:text="${organisation.name}">Организация</h1>
                <div>
                    <a th:href="@{/admin/organisations/{id}/edit(id=${organisation.id})}" 
                       class="btn btn-primary btn-sm">
                        <i class="fas fa-edit"></i> Редактировать
                    </a>
                    <button class="btn btn-danger btn-sm" 
                            th:attr="data-id=${organisation.id}"
                            onclick="confirmDelete(this.getAttribute('data-id'))">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                </div>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Основная информация -->
                <div class="col-xl-6 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-4">Статус</dt>
                                <dd class="col-sm-8">
                                    <span th:if="${organisation.active}" class="badge badge-success">Активна</span>
                                    <span th:unless="${organisation.active}" class="badge badge-danger">Неактивна</span>
                                </dd>

                                <dt class="col-sm-4">Владелец</dt>
                                <dd class="col-sm-8">
                                    <a th:href="@{/admin/users/{id}(id=${organisation.ownerId})}" 
                                       th:text="${organisation.ownerEmail}"></a>
                                </dd>

                                <dt class="col-sm-4">Описание</dt>
                                <dd class="col-sm-8" th:text="${organisation.description}"></dd>

                                <dt class="col-sm-4">Создана</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(organisation.createdAt, 'dd.MM.yyyy')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="col-xl-6 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика продуктов</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                        Всего продуктов</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${organisation.totalProducts}">0</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                        Активных продуктов</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${organisation.activeProducts}">0</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Продукты -->
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Продукты</h6>
                    <a th:href="@{/admin/organisations/{id}/products/create(id=${organisation.id})}" 
                       class="btn btn-primary btn-sm">
                        <i class="fas fa-plus"></i> Добавить продукт
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${organisation.products}">
                                    <td th:text="${product.id}"></td>
                                    <td>
                                        <a th:href="@{/admin/products/{id}(id=${product.id})}" 
                                           th:text="${product.name}"></a>
                                    </td>
                                    <td th:text="${product.description}"></td>
                                    <td>
                                        <span th:if="${product.active}" class="badge badge-success">Активен</span>
                                        <span th:unless="${product.active}" class="badge badge-danger">Неактивен</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" 
                                           class="btn btn-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button class="btn btn-danger btn-sm" 
                                                th:onclick="'confirmDeleteProduct(' + ${product.id} + ')'">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(organisation.products)}">
                                    <td colspan="5" class="text-center">Продукты не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/organisations.js}"></script>
    <script>
    function confirmDelete(id) {
        if (confirm('Вы уверены, что хотите удалить эту организацию?')) {
            deleteOrganisation(id);
        }
    }

    function confirmDeleteProduct(id) {
        if (confirm('Вы уверены, что хотите удалить этот продукт?')) {
            deleteProduct(id);
        }
    }

    function deleteOrganisation(id) {
        fetch(`/api/organisations/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                window.location.href = '/admin/organisations';
            } else {
                alert('Ошибка при удалении организации');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при удалении организации');
        });
    }

    function deleteProduct(id) {
        fetch(`/api/products/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при удалении продукта');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при удалении продукта');
        });
    }
    </script>
</body>
</html>
