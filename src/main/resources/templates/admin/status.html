<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="admin/layout :: html(~{::content})">
<body>
    <div th:fragment="content">
        <!-- Hero секция -->
        <div class="bg-primary text-white py-4 mb-4">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col">
                        <h1 class="display-5 mb-0">
                            <i class="bi bi-flag"></i> Статусы заявок
                        </h1>
                        <div class="d-flex mt-3">
                            <div class="me-4">
                                <span class="d-block text-white-50">Всего статусов</span>
                                <h2 class="mb-0" th:text="${statuses.totalElements}">0</h2>
                            </div>
                            <div>
                                <span class="d-block text-white-50">Активных заявок</span>
                                <h2 class="mb-0" th:text="${totalBids}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-auto">
                        <button type="button" 
                                class="btn btn-lg btn-light"
                                data-bs-toggle="modal"
                                data-bs-target="#statusModal">
                            <i class="bi bi-plus-lg"></i> Новый статус
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid">
            <!-- Список статусов -->
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div th:each="status : ${statuses.content}" class="col">
                    <div class="card h-100 status-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="card-title mb-0">
                                    <span class="badge"
                                          th:text="${status.status}"
                                          th:switch="${status.status}">
                                        <th:block th:case="'НОВАЯ'">
                                            <th:block th:classappend="bg-primary"/>
                                        </th:block>
                                        <th:block th:case="'В ОБРАБОТКЕ'">
                                            <th:block th:classappend="bg-warning"/>
                                        </th:block>
                                        <th:block th:case="'ВЫПОЛНЕНА'">
                                            <th:block th:classappend="bg-success"/>
                                        </th:block>
                                        <th:block th:case="*">
                                            <th:block th:classappend="bg-secondary"/>
                                        </th:block>
                                        Статус
                                    </span>
                                </h5>
                                <span class="badge bg-primary" 
                                      th:text="${#lists.size(status.bids) + ' заявок'}">
                                    0 заявок
                                </span>
                            </div>
                            <p class="card-text text-muted" th:if="${status.description}">
                                <small th:text="${status.description}">Описание</small>
                            </p>
                            
                            <!-- Список последних заявок -->
                            <div class="list-group list-group-flush small mt-3">
                                <a th:each="bid : ${status.bids}"
                                   th:href="@{/admin/bids/{id}(id=${bid.id})}"
                                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <div>
                                        <span th:text="${bid.service.name}">Услуга</span>
                                        <small class="d-block text-muted" 
                                               th:text="${bid.citizen.lastName + ' ' + bid.citizen.firstName}">
                                            ФИО
                                        </small>
                                    </div>
                                    <small class="text-muted" 
                                           th:text="${#temporals.format(bid.date, 'dd.MM.yyyy')}">
                                        01.01.2024
                                    </small>
                                </a>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <div class="btn-group w-100">
                                <button type="button" 
                                        class="btn btn-outline-primary"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#editModal' + ${status.id}"
                                        title="Редактировать">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button type="button" 
                                        class="btn btn-outline-danger"
                                        th:onclick="'confirmDelete(event, \'Вы уверены, что хотите удалить статус?\'); document.getElementById(\'deleteForm' + ${status.id} + '\').submit();'"
                                        title="Удалить"
                                        th:disabled="${not #lists.isEmpty(status.bids)}">
                                    <i class="bi bi-trash"></i>
                                </button>
                                <form th:id="'deleteForm' + ${status.id}"
                                      th:action="@{/admin/statuses/{id}(id=${status.id})}" 
                                      method="post" 
                                      style="display: none;">
                                    <input type="hidden" name="_method" value="DELETE">
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Модальное окно редактирования -->
                    <div class="modal fade" th:id="'editModal' + ${status.id}">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        <i class="bi bi-pencil"></i> Редактирование статуса
                                    </h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <form th:action="@{/admin/statuses/{id}(id=${status.id})}"
                                      method="post"
                                      class="needs-validation"
                                      novalidate>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label">Название</label>
                                            <input type="text" 
                                                   class="form-control" 
                                                   name="status"
                                                   th:value="${status.status}"
                                                   required>
                                            <div class="invalid-feedback">
                                                Введите название статуса
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Описание</label>
                                            <textarea class="form-control" 
                                                      name="description" 
                                                      rows="3"
                                                      th:text="${status.description}"></textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" 
                                                class="btn btn-light" 
                                                data-bs-dismiss="modal">
                                            Отмена
                                        </button>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-lg"></i> Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Пагинация -->
            <div th:replace="fragments/pagination :: pagination(${statuses})"></div>
        </div>

        <!-- Модальное окно создания -->
        <div class="modal fade" id="statusModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-plus-lg"></i> Новый статус
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/statuses}"
                          method="post"
                          class="needs-validation"
                          novalidate>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Название</label>
                                <input type="text" 
                                       class="form-control" 
                                       name="status"
                                       required>
                                <div class="invalid-feedback">
                                    Введите название статуса
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea class="form-control" 
                                          name="description" 
                                          rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" 
                                    class="btn btn-light" 
                                    data-bs-dismiss="modal">
                                Отмена
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-lg"></i> Создать
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Custom CSS -->
        <style>
            .status-card {
                transition: transform .2s;
            }
            .status-card:hover {
                transform: translateY(-5px);
            }
            .badge {
                font-weight: 500;
            }
            .btn-group .btn {
                flex: 1;
            }
            .list-group-item {
                transition: background-color .2s;
            }
            .list-group-item:hover {
                background-color: rgba(13, 110, 253, 0.05);
            }
        </style>

        <!-- JavaScript -->
        <script>
            // Валидация форм
            (function() {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms)
                    .forEach(function(form) {
                        form.addEventListener('submit', function(event) {
                            if (!form.checkValidity()) {
                                event.preventDefault()
                                event.stopPropagation()
                            }
                            form.classList.add('was-validated')
                        }, false)
                    })
            })()

            // Подтверждение удаления
            function confirmDelete(event, message) {
                if (!confirm(message)) {
                    event.preventDefault()
                }
            }
        </script>
    </div>
</body>
</html>
