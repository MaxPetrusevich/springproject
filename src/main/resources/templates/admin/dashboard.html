<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Панель администратора</title>
    <style>
        /* Компактные стили для графиков */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            margin-bottom: 20px;
        }
        .card .card-body {
            padding: 15px;
        }
    </style>
</head>
<body>
<div th:replace="layout/main :: layout(~{::main})">
    <main>
        <div class="container-fluid py-4">
            <!-- Заголовок -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">Панель управления</h1>
            </div>

            <!-- Графики -->
            <div class="row mb-3">
                <!-- График роста пользователей -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="card-title mb-0">Динамика пользователей</h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="userGrowthChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- График дохода -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="card-title mb-0">Динамика дохода</h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="revenueGrowthChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Таблицы -->
            <div class="row">
                <!-- Последние пользователи -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="card-title mb-0">Новые пользователи</h6>
                            <a href="/admin/users" class="btn btn-primary btn-sm">
                                <i class="bi bi-people"></i> Все пользователи
                            </a>
                        </div>
                        <div class="card-body">
                            <div th:replace="admin/fragments/users-table :: table(${recentUsers})"></div>
                        </div>
                    </div>
                </div>

                <!-- Последние подписки -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="card-title mb-0">Новые подписки</h6>
                            <a href="/admin/subscriptions" class="btn btn-primary btn-sm">
                                <i class="bi bi-card-checklist"></i> Все подписки
                            </a>
                        </div>
                        <div class="card-body">
                            <div th:replace="admin/fragments/subscriptions-table :: table(${recentSubscriptions})"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/main.js}"></script>

<!-- Инициализация графиков -->
<script th:inline="javascript">
    const userGrowthData = /*[[${statistics.userGrowth}]]*/ {};
    const revenueGrowthData = /*[[${statistics.revenueGrowth}]]*/ {};

    const createChart = (ctx, label, data, unit) => {
        return new Chart(ctx, {
            type: 'line',
            data: {
                labels: Object.keys(data),
                datasets: [{
                    label: label,
                    data: Object.values(data),
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.3,
                    pointRadius: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(tooltipItem) {
                                return tooltipItem.raw + (unit ? ` ${unit}` : '');
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return value + (unit ? ` ${unit}` : '');
                            }
                        }
                    }
                }
            }
        });
    };

    createChart(
        document.getElementById('userGrowthChart'),
        'Новые пользователи',
        userGrowthData,
        ''
    );

    createChart(
        document.getElementById('revenueGrowthChart'),
        'Доход',
        revenueGrowthData,
        'BYN'
    );
</script>
</body>
</html>
