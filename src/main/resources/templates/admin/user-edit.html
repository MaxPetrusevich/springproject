<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head"></head>
<body>
    <div th:replace="admin/layout :: layout(~{::main})">
        <main>
            <div class="container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0" th:text="${user.id == null ? 'Создание пользователя' : 'Редактирование пользователя'}">
                                    Пользователь
                                </h5>
                            </div>
                            <div class="card-body">
                                <form th:action="${user.id == null ? '/admin/users' : '/admin/users/' + user.id}"
                                      th:object="${user}"
                                      method="post">

                                    <div class="mb-3">
                                        <label class="form-label">ИИН</label>
                                        <input type="text"
                                               class="form-control" readonly
                                               th:field="*{identifyNumber}"
                                               th:classappend="${#fields.hasErrors('identifyNumber')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('identifyNumber')}"
                                             th:errors="*{identifyNumber}">
                                            Ошибка
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Пароль</label>
                                        <input type="password" 
                                               class="form-control" 
                                               th:field="*{password}"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                             th:errors="*{password}">
                                            Ошибка
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Роль</label>
                                        <select class="form-select" 
                                                th:field="*{roleId}"
                                                th:classappend="${#fields.hasErrors('roleId')} ? 'is-invalid'">
                                            <option value="">Выберите роль</option>
                                            <option th:each="role : ${roles}"
                                                    th:value="${role.id}"
                                                    th:text="${role.roleName}">
                                            </option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('roleId')}"
                                             th:errors="*{roleId}">
                                            Ошибка
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a th:href="@{/admin/users}" class="btn btn-secondary">
                                            <i class="bi bi-arrow-left"></i> Назад
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-lg"></i> Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
