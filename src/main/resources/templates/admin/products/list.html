<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Продукты</title>
    <style>
        .table .btn-group {
            display: flex;
            gap: 4px;
        }
        
        .table .btn {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            font-size: 14px;
            line-height: 1;
        }
        
        .table .btn i {
            margin-right: 4px;
        }
        
        .filter-panel {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .filter-panel .btn {
            margin-right: 8px;
        }
        
        .filter-panel .form-group {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Продукты</h1>
                <a href="/admin/products/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50"></i> Создать продукт
                </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="category">
                                <option value="">Все категории</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat}"
                                        th:text="${cat}"
                                        th:selected="${cat == selectedCategory}">
                                    Категория
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="organisationId">
                                <option value="">Все организации</option>
                                <option th:each="org : ${organisations}"
                                        th:value="${org.id}"
                                        th:text="${org.name}"
                                        th:selected="${org.id == selectedOrganisation}">
                                    Организация
                                </option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Организация</th>
                                    <th>Категория</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td th:text="${product.id}"></td>
                                    <td>
                                        <a th:href="@{/admin/products/{id}(id=${product.id})}" 
                                           th:text="${product.name}"></a>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/organisations/{id}(id=${product.organisation.id})}"
                                           th:text="${product.organisation.name}"></a>
                                    </td>
                                    <td th:text="${product.category}"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/products/{id}(id=${product.id})}" 
                                               class="btn btn-primary">
                                                <i class="bi bi-eye me-1"></i>
                                                <span>Просмотр</span>
                                            </a>
                                            <button type="button" class="btn"
                                                th:classappend="${product.active ? 'btn-danger' : 'btn-success'}"
                                                th:onclick="'toggleProductStatus(' + ${product.id} + ')'">
                                                <i class="bi" 
                                                    th:classappend="${product.active ? 'bi-lock me-1' : 'bi-unlock me-1'}">
                                                </i>
                                                <span th:text="${product.active ? 'Заблокировать' : 'Разблокировать'}">
                                                </span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="5" class="text-center">Продукты не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/products.js}"></script>
    <script>
    function confirmDelete(id) {
        if (confirm('Вы уверены, что хотите удалить этот продукт?')) {
            deleteProduct(id);
        }
    }

    function deleteProduct(id) {
        fetch(`/api/products/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при удалении продукта');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при удалении продукта');
        });
    }
    </script>
</body>
</html>
