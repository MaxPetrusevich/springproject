<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head"></head>
<body>
<div th:replace="admin/layout :: layout(~{::main})">
    <main>
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Услуги</h1>
                <a th:href="@{/admin/services/create}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Добавить услугу
                </a>
            </div>

            <!-- Фильтры -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Категория</label>
                            <select class="form-select" name="categoryId">
                                <option value="">Все категории</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.category}"
                                        th:selected="${param.categoryId != null && param.categoryId[0] == category.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Учреждение</label>
                            <select class="form-select" name="establishmentId">
                                <option value="">Все учреждения</option>
                                <option th:each="establishment : ${establishments}"
                                        th:value="${establishment.id}"
                                        th:text="${establishment.name}"
                                        th:selected="${param.establishmentId != null && param.establishmentId[0] == establishment.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                            <a th:href="@{/admin/services}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Сброс
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Таблица -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Учреждение</th>
                                <th>Стоимость</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="service : ${services}">
                                <td th:text="${service.id}"></td>
                                <td th:text="${service.name}"></td>
                                <td th:text="${service.category?.category}"></td>
                                <td th:text="${service.establishment?.name}"></td>
                                <td th:text="${service?.price}"></td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/admin/services/{id}/edit(id=${service.id})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#deleteModal' + ${service.id}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>

                                    <!-- Модальное окно удаления -->
                                    <div class="modal fade" th:id="'deleteModal' + ${service.id}">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Подтверждение удаления</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    Вы действительно хотите удалить услугу?
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                                    <form th:action="@{/admin/services/{id}/delete(id=${service.id})}"
                                                          method="post"
                                                          style="display: inline;">
                                                        <input type="hidden" name="_method" value="DELETE">
                                                        <button type="submit" class="btn btn-danger">Удалить</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Пагинация -->
                    <nav th:if="${services.totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${services.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/services(page=${services.number - 1})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, services.totalPages - 1)}"
                                th:classappend="${services.number == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/services(page=${i})}" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${services.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/services(page=${services.number + 1})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
