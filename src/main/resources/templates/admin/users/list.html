<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Пользователи</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Пользователи</h1>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="role">
                                <option value="">Все роли</option>
                                <option th:each="role : ${roles}"
                                        th:value="${role}"
                                        th:text="${role}"
                                        th:selected="${role == selectedRole}">
                                    Роль
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="enabled">
                                <option value="">Любой статус</option>
                                <option value="true" th:selected="${enabled != null && enabled}">Активные</option>
                                <option value="false" th:selected="${enabled != null && !enabled}">Заблокированные</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Email</th>
                                    <th>Имя</th>
                                    <th>Роль</th>
                                    <th>Статус</th>
                                    <th>Дата создания</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">1</td>
                                    <td th:text="${user.email}">user@example.com</td>
                                    <td>
                                        <span th:text="${user.firstName + ' ' + user.lastName}">John Doe</span>
                                    </td>
                                    <td th:text="${user.role}">USER</td>
                                    <td>
                                        <span th:if="${user.enabled}" class="badge badge-success">Активен</span>
                                        <span th:unless="${user.enabled}" class="badge badge-danger">Заблокирован</span>
                                    </td>
                                    <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2024</td>
                                    <td>
                                        <a th:href="@{/admin/users/{id}(id=${user.id})}" 
                                           class="btn btn-sm btn-info">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <form th:if="${user.enabled}" 
                                              th:action="@{/admin/users/{id}/block(id=${user.id})}" 
                                              method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                <i class="bi bi-lock"></i>
                                            </button>
                                        </form>
                                        <form th:unless="${user.enabled}" 
                                              th:action="@{/admin/users/{id}/unblock(id=${user.id})}" 
                                              method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-success">
                                                <i class="bi bi-unlock"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="6" class="text-center">Пользователи не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/users.js}"></script>
</body>
</html>
