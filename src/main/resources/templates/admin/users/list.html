<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Пользователи</title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Пользователи</h1>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="role">
                                <option value="">Все роли</option>
                                <option th:each="role : ${roles}"
                                        th:value="${role}"
                                        th:text="${role}"
                                        th:selected="${role == selectedRole}">
                                    Роль
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="enabled">
                                <option value="">Все статусы</option>
                                <option value="true" th:selected="${enabled == true}">Активные</option>
                                <option value="false" th:selected="${enabled == false}">Заблокированные</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Имя</th>
                                    <th>Роль</th>
                                    <th>Статус</th>
                                    <th>Дата регистрации</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                                    <td>
                                        <span th:class="${'badge ' + 
                                            (user.role.name() == 'ADMIN' ? 'bg-danger' :
                                            (user.role.name() == 'ORGANIZER' ? 'bg-success' : 'bg-primary'))}"
                                              th:text="${user.role}">
                                        </span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge ' + (user.enabled ? 'bg-success' : 'bg-danger')}"
                                              th:text="${user.enabled ? 'Активен' : 'Заблокирован'}">
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/users/{id}(id=${user.id})}" 
                                                class="btn btn-primary">
                                                <i class="bi bi-eye me-1"></i>
                                                <span>Просмотр</span>
                                            </a>
                                            <button type="button" class="btn"
                                                th:classappend="${user.enabled ? 'btn-danger' : 'btn-success'}"
                                                th:onclick="'toggleUserStatus(' + ${user.id} + ')'">
                                                <i class="bi" 
                                                    th:classappend="${user.enabled ? 'bi-lock me-1' : 'bi-unlock me-1'}">
                                                </i>
                                                <span th:text="${user.enabled ? 'Заблокировать' : 'Разблокировать'}">
                                                </span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="6" class="text-center">Пользователи не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/users.js}"></script>
</body>
</html>
