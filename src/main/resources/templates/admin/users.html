<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head"></head>
<body>
<div th:replace="admin/layout :: layout(~{::main})">
    <main>
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Пользователи</h1>
                <a th:href="@{/admin/users/create}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Добавить пользователя
                </a>
            </div>

            <!-- Фильтры -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">ИИН</label>
                            <input type="text" class="form-control" name="identifyNumber"
                                   th:value="${param.identifyNumber}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Роль</label>
                            <select class="form-select" name="roleId">
                                <option value="">Все роли</option>
                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${role.roleName}"
                                        th:selected="${param.roleId != null && param.roleId[0] == role.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Сброс
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Таблица -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>ИИН</th>
                                <th>Роль</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.identifyNumber}"></td>
                                <td th:text="${user.role.roleName}"></td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#deleteModal' + ${user.id}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>

                                    <!-- Модальное окно удаления -->
                                    <div class="modal fade" th:id="'deleteModal' + ${user.id}">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Подтверждение удаления</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    Вы действительно хотите удалить пользователя?
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                                          method="post"
                                                          style="display: inline;">
                                                        <input type="hidden" name="_method" value="DELETE">
                                                        <button type="submit" class="btn btn-danger">Удалить</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Пагинация -->
                    <nav th:if="${users.totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${users.number - 1})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                                th:classappend="${users.number == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${i})}" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${users.number + 1})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
