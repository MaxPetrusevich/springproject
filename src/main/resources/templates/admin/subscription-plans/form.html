<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title th:text="${plan.id == null ? 'Создание плана' : 'Редактирование плана'}"></title>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" 
                    th:text="${plan.id == null ? 'Создание плана' : 'Редактирование плана #' + plan.id}">
                </h1>
            </div>

            <!-- Content Row -->
            <div class="row">
                <div class="col-xl-12 col-md-12 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Данные плана</h6>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/subscription-plans}" method="post" th:object="${plan}">
                                <!-- ID плана если редактирование -->
                                <input type="hidden" th:field="*{id}">
                                
                                <!-- ID продукта если он уже назначен -->
                                <input th:if="${plan.productId != null}" 
                                       type="hidden" 
                                       th:field="*{productId}">
                                
                                <!-- Название -->
                                <div class="mb-3">
                                    <label for="name" class="form-label">Название *</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                        Ошибка названия
                                    </div>
                                </div>

                                <!-- Описание -->
                                <div class="mb-3">
                                    <label for="description" class="form-label">Описание</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                                </div>

                                <!-- Выбор продукта только если он не назначен -->
                                <div class="mb-3" th:if="${plan.productId == null}">
                                    <label for="productId" class="form-label">Продукт *</label>
                                    <select class="form-select" id="productId" th:field="*{productId}" required>
                                        <option value="">Выберите продукт</option>
                                        <option th:each="prod : ${products}"
                                                th:value="${prod.id}"
                                                th:text="${prod.name}">
                                            Продукт
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('productId')}">
                                        Выберите продукт
                                    </div>
                                </div>

                                <!-- Цена -->
                                <div class="mb-3">
                                    <label for="price" class="form-label">Цена *</label>
                                    <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
                                </div>

                                <!-- Период -->
                                <div class="mb-3">
                                    <label for="periodDays" class="form-label">Период (дней) *</label>
                                    <input type="number" class="form-control" id="periodDays" th:field="*{periodDays}" required>
                                </div>

                                <div class="mb-3" th:if="${plan.id != null}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                        <label class="form-check-label" for="active">
                                            Активен
                                        </label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/admin/products/{id}(id=${product.id})}" class="btn btn-secondary">
                                        Отмена
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save"></i> Сохранить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/subscription-plans.js}"></script>
</body>
</html>
