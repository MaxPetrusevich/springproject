<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head">
    <title>Планы подписок</title>
    <style>
        .table .btn-group {
            display: flex;
            gap: 4px;
        }
        
        .table .btn {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            font-size: 14px;
            line-height: 1;
        }
        
        .table .btn i {
            margin-right: 4px;
        }
        
        .filter-panel {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .filter-panel .btn {
            margin-right: 8px;
        }
        
        .filter-panel .form-group {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div th:replace="layout/main :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Пла��ы подписок</h1>
                <a href="/admin/subscription-plans/create" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i> Создать план
                </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="productId">
                                <option value="">Все продукты</option>
                                <option th:each="product : ${products}"
                                        th:value="${product.id}"
                                        th:text="${product.name}"
                                        th:selected="${product.id == selectedProduct}">
                                    Продукт
                                </option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Plans List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Продукт</th>
                                    <th>Цена</th>
                                    <th>Период (дней)</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="plan : ${plans}">
                                    <td th:text="${plan.id}"></td>
                                    <td th:text="${plan.name}"></td>
                                    <td>
                                        <a th:if="${plan.productId != null}" 
                                           th:href="@{/admin/products/{id}(id=${plan.productId})}" 
                                           th:text="${plan.productName}">
                                            Название продукта
                                        </a>
                                        <span th:unless="${plan.productId != null}">-</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info text-white">
                                            <span th:text="${#numbers.formatDecimal(plan.price, 1, 'COMMA', 2, 'POINT')}"></span>₽
                                        </span>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary text-white">
                                            <span th:text="${plan.periodDays}"></span> дней
                                        </span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge ' + 
                                            (plan.active ? 'bg-success text-white' : 'bg-danger text-white')}"
                                              th:text="${plan.active ? 'Активен' : 'Заблокирован'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/subscription-plans/{id}(id=${plan.id})}" 
                                               class="btn btn-primary">
                                                <i class="bi bi-eye me-1"></i>
                                                <span>Просмотр</span>
                                            </a>
                                            <button type="button" class="btn"
                                                th:classappend="${plan.active ? 'btn-danger' : 'btn-success'}"
                                                th:onclick="'togglePlanStatus(' + ${plan.id} + ')'">
                                                <i class="bi" 
                                                    th:classappend="${plan.active ? 'bi-lock me-1' : 'bi-unlock me-1'}">
                                                </i>
                                                <span th:text="${plan.active ? 'Заблокировать' : 'Разблокировать'}">
                                                </span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(plans)}">
                                    <td colspan="7" class="text-center">Планы не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Page specific scripts -->
    <script th:src="@{/js/admin/subscription-plans.js}"></script>
</body>
</html>
