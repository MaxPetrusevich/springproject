<div th:fragment="table(users)">
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Роль</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.firstName + ' ' + user.lastName}">Иван Иванов</td>
                    <td th:text="${user.email}">user@example.com</td>
                    <td>
                        <span th:switch="${user.role}">
                            <span th:case="'ADMIN'" class="badge bg-danger">Админ</span>
                            <span th:case="'ORGANIZER'" class="badge bg-success">Организатор</span>
                            <span th:case="*" class="badge bg-primary">Пользователь</span>
                        </span>
                    </td>
                    <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">01.01.2024</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
