<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:with="title='Вход в систему'">
<head th:replace="layout :: head"></head>
<body class="bg-light">
    <!-- Навигация -->
    <div th:replace="layout :: nav"></div>

    <div class="container py-5">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12">
                <div class="card login-card mx-auto">
                    <div class="card-header text-center py-4">
                        <h4 class="mb-0">
                            <i class="bi bi-box-arrow-in-right"></i> Вход в систему
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Сообщения об ошибках -->
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Неверный ИИН или пароль
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Вы успешно вышли из системы
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span th:text="${successMessage}">Success message</span>
                        </div>

                        <!-- Форма входа -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="identifyNumber" class="form-label">ИИН</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="identifyNumber" 
                                           name="identifyNumber"
                                           required
                                           pattern="^[0-9]{12}$"
                                           placeholder="Введите ИИН">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-key"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control" 
                                           id="password" 
                                           name="password"
                                           required
                                           placeholder="Введите пароль">
                                    <button class="btn btn-outline-secondary" 
                                            type="button"
                                            onclick="togglePassword()">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i> Войти
                                </button>
                                <a href="/registration" class="btn btn-outline-secondary">
                                    <i class="bi bi-person-plus"></i> Нет аккаунта? Зарегистрироваться
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = event.currentTarget.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>

    <style>
        .login-card {
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .login-card .card-header {
            border-radius: 15px 15px 0 0;
            background-color: #fff;
            border-bottom: 1px solid rgba(0,0,0,.05);
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</body>
</html>
