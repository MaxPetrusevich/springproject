<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:with="title='Регистрация'">
<head th:replace="fragments/public-header :: head"></head>
<body class="bg-light">
    <div th:replace="fragments/public-header :: header"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Регистрация</h2>

                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}">Error message</span>
                        </div>

                        <form th:action="@{/registration}" method="post" 
                              th:object="${userRegisterDto}" class="needs-validation" novalidate>
                            
                            <!-- Личные данные -->
                            <h5 class="mb-3">Личные данные</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label for="lastName" class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" id="lastName" 
                                           th:field="*{lastName}" required>
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('lastName')}" 
                                         th:errors="*{lastName}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label for="firstName" class="form-label">Имя</label>
                                    <input type="text" class="form-control" id="firstName" 
                                           th:field="*{firstName}" required>
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('firstName')}" 
                                         th:errors="*{firstName}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label for="middleName" class="form-label">Отчество</label>
                                    <input type="text" class="form-control" id="middleName" 
                                           th:field="*{middleName}">
                                </div>
                            </div>

                            <!-- Документы -->
                            <h5 class="mb-3">Документы</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="identifyNumber" class="form-label">ИИН</label>
                                    <input type="text" class="form-control" id="identifyNumber" 
                                           th:field="*{identifyNumber}" required
                                           pattern="[0-9]{12}">
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('identifyNumber')}" 
                                         th:errors="*{identifyNumber}">Error</div>
                                </div>
                                <div class="col-md-3">
                                    <label for="passportSeries" class="form-label">Серия паспорта</label>
                                    <input type="text" class="form-control" id="passportSeries" 
                                           th:field="*{passportSeries}" required
                                           pattern="[A-Z]{2}">
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('passportSeries')}" 
                                         th:errors="*{passportSeries}">Error</div>
                                </div>
                                <div class="col-md-3">
                                    <label for="passportNumber" class="form-label">Номер паспорта</label>
                                    <input type="text" class="form-control" id="passportNumber" 
                                           th:field="*{passportNumber}" required
                                           pattern="[0-9]{6}">
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('passportNumber')}" 
                                         th:errors="*{passportNumber}">Error</div>
                                </div>
                            </div>

                            <!-- Контактные данные -->
                            <h5 class="mb-3">Контактные данные</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Телефон</label>
                                    <input type="tel" class="form-control" id="phone" 
                                           th:field="*{phone}" required
                                           pattern="^\+?[0-9]{10,15}$">
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('phone')}" 
                                         th:errors="*{phone}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" 
                                           th:field="*{email}" required>
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label for="address" class="form-label">Адрес</label>
                                    <input type="text" class="form-control" id="address" 
                                           th:field="*{address}" required>
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('address')}" 
                                         th:errors="*{address}">Error</div>
                                </div>
                            </div>

                            <!-- Пароль -->
                            <h5 class="mb-3">Безопасность</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Пароль</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" 
                                               th:field="*{password}" required>
                                        <button class="btn btn-outline-secondary" type="button" 
                                                onclick="togglePassword('password')">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="form-text">
                                        Минимум 8 символов, включая заглавные и строчные буквы, 
                                        цифры и специальные символы
                                    </div>
                                    <div class="invalid-feedback" 
                                         th:if="${#fields.hasErrors('password')}" 
                                         th:errors="*{password}">Error</div>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Зарегистрироваться
                                </button>
                                <a href="/login" class="btn btn-outline-secondary">
                                    ��же есть аккаунт? Войти
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            const icon = event.currentTarget.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        }

        // Form validation
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
