<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow">
                    <div class="card-body">
                        <i th:class="${iconClass}" class="text-danger" style="font-size: 4rem;"></i>
                        <h2 class="mt-3" th:text="${heading}">Ошибка</h2>
                        <p class="text-muted" th:text="${message}">
                            Произошла ошибка.
                        </p>
                        <div class="mt-4">
                            <a href="javascript:history.back()" class="btn btn-secondary me-2">
                                <i class="bi bi-arrow-left"></i> Назад
                            </a>
                            <a sec:authorize="hasRole('ADMIN')" 
                               th:href="@{/admin/dashboard}" 
                               class="btn btn-primary">
                                <i class="bi bi-house"></i> На главную
                            </a>
                            <a sec:authorize="hasRole('ORGANIZER')" 
                               th:href="@{/organiser/dashboard}" 
                               class="btn btn-primary">
                                <i class="bi bi-house"></i> На главную
                            </a>
                            <a sec:authorize="hasRole('USER')" 
                               th:href="@{/customer/products}" 
                               class="btn btn-primary">
                                <i class="bi bi-house"></i> На главную
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
