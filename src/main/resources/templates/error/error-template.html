<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${status + ' - ' + message}">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        }
        .error-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #6B73FF;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0;
            color: #333;
        }
        .btn-primary {
            background: #6B73FF;
            border-color: #6B73FF;
        }
        .btn-primary:hover {
            background: #000DFF;
            border-color: #000DFF;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code" th:text="${status}">404</div>
        <div class="error-message" th:text="${message}">Page not found</div>
        <div class="d-grid gap-2">
            <a href="/" class="btn btn-primary">На главную</a>
            <button onclick="history.back()" class="btn btn-outline-secondary">Назад</button>
        </div>
    </div>
</div>
</body>
</html>
