<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Доступ запрещен</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <style>
        .error-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
            color: #fff;
        }
        .error-card {
            max-width: 500px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .error-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="error-page">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12">
                <div class="error-card mx-auto p-5 text-center">
                    <i class="bi bi-shield-lock error-icon"></i>
                    <div class="error-code">403</div>
                    <h2 class="mb-4">Доступ запрещен</h2>
                    <p class="mb-4">
                        У вас нет прав для доступа к этой странице. 
                        Пожалуйста, убедитесь, что вы авторизованы или обратитесь к администратору.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-outline-light">
                            <i class="bi bi-arrow-left"></i> Назад
                        </a>
                        <a th:href="@{/}" class="btn btn-light">
                            <i class="bi bi-house"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
