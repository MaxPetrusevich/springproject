<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка | Subscription Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        }
        .error-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code" th:text="${status}">404</div>
        <h2 class="mb-4" th:text="${error}">Страница не найдена</h2>
        
        <p class="text-muted mb-4" th:if="${message}" th:text="${message}">
            Запрашиваемая страница не существует
        </p>
        
        <div class="d-grid gap-2">
            <a href="/" class="btn btn-primary">На главную</a>
            <button onclick="history.back()" class="btn btn-outline-secondary">Назад</button>
        </div>
    </div>
</div>
</body>
</html>
