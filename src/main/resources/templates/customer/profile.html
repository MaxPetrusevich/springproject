<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="customer/layout :: head"></head>
<body>
    <div th:replace="customer/layout :: layout(~{::main})">
        <main>
            <div class="container">
                <h2 class="mb-4">Профиль пользователя</h2>
                
                <!-- Информация о пользователе -->
                <div class="row">
                    <div class="col-md-4">
                        <div class="card mb-4">
                            <div class="card-body text-center">
                                <img th:if="${user.image != null}" 
                                     th:src="@{'/users/' + ${user.id} + '/avatar'}"
                                     class="rounded-circle mb-3" 
                                     style="width: 150px; height: 150px;"
                                     alt="Avatar">
                                <i th:unless="${user.image != null}" 
                                   class="bi bi-person-circle" 
                                   style="font-size: 150px;"></i>
                                
                                <!-- Форма загрузки аватара -->
                                <form th:action="@{/customer/profile/avatar}" 
                                      method="post" 
                                      enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <input type="file" class="form-control" name="image" accept="image/*" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-upload"></i> Обновить аватар
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-8">
                        <!-- Личные данные -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Личные данные</h5>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/customer/profile/update}" method="post">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Фамилия</label>
                                            <input type="text" class="form-control" 
                                                   name="lastName" th:value="${citizen.lastName}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Имя</label>
                                            <input type="text" class="form-control" 
                                                   name="firstName" th:value="${citizen.firstName}">
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Отчество</label>
                                        <input type="text" class="form-control" 
                                               name="middleName" th:value="${citizen.middleName}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">ИИН</label>
                                        <input type="text" class="form-control" 
                                               th:value="${citizen.identifyNumber}" readonly>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" 
                                               name="email" th:value="${citizen.email}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Телефон</label>
                                        <input type="tel" class="form-control" 
                                               name="phone" th:value="${citizen.phone}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Адрес</label>
                                        <input type="text" class="form-control" 
                                               name="address" th:value="${citizen.address}">
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save"></i> Сохранить изменения
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <!-- Смена пароля -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Смена пароля</h5>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/customer/profile/password}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Текущий пароль</label>
                                        <input type="password" class="form-control" 
                                               name="currentPassword" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Новый пароль</label>
                                        <input type="password" class="form-control" 
                                               name="newPassword" required>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-key"></i> Изменить пароль
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
