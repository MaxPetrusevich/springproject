<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/customer :: head">
    <title>Профиль | Subscription Management</title>
    <style>
        .avatar-upload {
            position: relative;
            max-width: 150px;
            margin: 0 auto;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-edit {
            text-align: center;
        }

        .avatar-edit label {
            cursor: pointer;
        }

        .avatar-edit input {
            display: none;
        }
    </style>
</head>
<body>
    <th:block th:replace="layout/customer :: layout(~{::section})">
        <section>
            <div class="container">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <div class="text-center mb-4">
                                    <div class="profile-image d-flex flex-column align-items-center">
                                        <img th:if="${user.avatarUrl != null and !user.avatarUrl.isEmpty()}" 
                                             th:src="@{'/files/avatars/' + ${user.avatarUrl}}"
                                             alt="Аватар пользователя"
                                             class="rounded-circle img-fluid mb-3" 
                                             style="width: 150px; height: 150px; object-fit: cover;">
                                        
                                        <div th:unless="${user.avatarUrl != null and !user.avatarUrl.isEmpty()}" 
                                             class="avatar-placeholder rounded-circle mb-3 d-flex align-items-center justify-content-center"
                                             style="width: 150px; height: 150px; background-color: #e9ecef; color: #6c757d; font-size: 2.5rem;">
                                            <span th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">ИФ</span>
                                        </div>
                                        
                                        <div>
                                            <form id="avatarForm" enctype="multipart/form-data">
                                                <input type="file" id="avatarFile" name="file" 
                                                       accept="image/*" class="d-none">
                                                <label for="avatarFile" class="btn btn-primary">
                                                    <i class="bi bi-camera me-2"></i>Изменить фото
                                                </label>
                                            </form>
                                        </div>
                                    </div>
                                    <h4 class="mt-3" th:text="${user.firstName + ' ' + user.lastName}">Имя Фамилия</h4>
                                    <p class="text-muted" th:text="${user.email}">email@example.com</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Личные данные</h5>
                                <form id="profileForm" onsubmit="updateProfile(event)">
                                    <div class="mb-3">
                                        <label for="firstName" class="form-label">Имя</label>
                                        <input type="text" class="form-control" id="firstName" 
                                               th:value="${user.firstName}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="lastName" class="form-label">Фамилия</label>
                                        <input type="text" class="form-control" id="lastName" 
                                               th:value="${user.lastName}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" 
                                               th:value="${user.email}" readonly>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                                </form>
                            </div>
                        </div>

                        <div class="card mt-4">
                            <div class="card-body">
                                <h5 class="card-title">Изменить пароль</h5>
                                <form id="passwordForm" onsubmit="changePassword(event)">
                                    <div class="mb-3">
                                        <label for="currentPassword" class="form-label">Текущий пароль</label>
                                        <input type="password" class="form-control" id="currentPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label">Новый пароль</label>
                                        <input type="password" class="form-control" id="newPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                                        <input type="password" class="form-control" id="confirmPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Изменить пароль</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                document.getElementById('avatarFile').addEventListener('change', function() {
                    const formData = new FormData();
                    formData.append('file', this.files[0]);

                    fetch('/api/users/profile/avatar', {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin'
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Ошибка при загрузке файла');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.avatarUrl) {
                            const avatarImg = document.querySelector('.profile-image img');
                            avatarImg.src = '/files/avatars/' + data.avatarUrl;
                            showNotification('Аватар успешно обновлен', 'success');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showNotification('Ошибка при загрузке файла', 'danger');
                    });
                });

                // Обновление профиля
                function updateProfile(event) {
                    event.preventDefault();
                    
                    const formData = {
                        firstName: document.getElementById('firstName').value,
                        lastName: document.getElementById('lastName').value
                    };
                    
                    fetch('/api/users/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData),
                        credentials: 'same-origin'
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(data => {
                                throw new Error(data.message || 'Ошибка при обновлении профиля');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        alert('Профиль успешно обновлен');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert(error.message);
                    });
                }

                // Смена пароля
                function changePassword(event) {
                    event.preventDefault();
                    
                    const formData = {
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword: document.getElementById('newPassword').value,
                        confirmPassword: document.getElementById('confirmPassword').value
                    };
                    
                    fetch('/api/users/profile/password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData),
                        credentials: 'same-origin'
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(data => {
                                throw new Error(data.message || 'Ошибка при смене пароля');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        alert(data.message);
                        document.getElementById('passwordForm').reset();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert(error.message);
                    });
                }
            </script>
        </section>
    </th:block>
</body>
</html>
