<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="customer/layout :: head"></head>
<body>
<div th:replace="customer/layout :: layout(~{::main})">
    <main>
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Документы</h2>
            </div>

            <!-- Фильтры -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Тип документа</label>
                            <select class="form-select" name="typeId">
                                <option value="">Все типы</option>
                                <option th:each="type : ${types}"
                                        th:value="${type.id}"
                                        th:text="${type.type}"
                                        th:selected="${param.typeId != null && param.typeId[0] == type.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Заявка</label>
                            <select class="form-select" name="bidId">
                                <option value="">Все заявки</option>
                                <option th:each="bid : ${bids}"
                                        th:value="${bid.id}"
                                        th:text="${'Заявка #' + bid.id + ' - ' + bid.service.name}"
                                        th:selected="${param.bidId != null && param.bidId[0] == bid.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Применить фильтры
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Таблица документов -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(documents.content)}" class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        Документы не найдены
                    </div>

                    <div th:unless="${#lists.isEmpty(documents.content)}" class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Тип</th>
                                <th>Заявка</th>
                                <th>Дата</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="doc : ${documents}">
                                <td th:text="${doc.id}"></td>
                                <td th:text="${doc.originalFilename}"></td>
                                <td th:text="${doc.type.type}"></td>
                                <td>
                                    <span th:text="${'#' + doc.bid.id + ' - ' + doc.bid.service.name}"></span>
                                </td>
                                <td th:text="${#temporals.format(doc.loadingDate, 'dd.MM.yyyy')}"></td>
                                <td>
                                    <a th:href="@{/customer/documents/{id}/download(id=${doc.id})}"
                                       class="btn btn-sm btn-primary">
                                        <i class="bi bi-download"></i> Скачать
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Пагинация -->
                    <nav th:if="${documents.totalPages > 1}" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${documents.first} ? 'disabled'">
                                <a class="page-link" 
                                   th:href="@{''(page=${documents.number - 1})}"
                                   th:if="${!documents.first}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                                <span class="page-link" th:if="${documents.first}">
                                    <i class="bi bi-chevron-left"></i>
                                </span>
                            </li>
                            
                            <li class="page-item" 
                                th:each="pageNumber : ${#numbers.sequence(0, documents.totalPages - 1)}"
                                th:classappend="${pageNumber == documents.number} ? 'active'">
                                <a class="page-link" 
                                   th:href="@{''(page=${pageNumber})}" 
                                   th:text="${pageNumber + 1}">1</a>
                            </li>
                            
                            <li class="page-item" th:classappend="${documents.last} ? 'disabled'">
                                <a class="page-link" 
                                   th:href="@{''(page=${documents.number + 1})}"
                                   th:if="${!documents.last}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                                <span class="page-link" th:if="${documents.last}">
                                    <i class="bi bi-chevron-right"></i>
                                </span>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
