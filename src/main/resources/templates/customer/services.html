<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="customer/layout :: head"></head>
<body>
<div th:replace="customer/layout :: layout(~{::main})">
    <main>
        <div class="container-fluid py-4">
            <!-- Фильтры -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Категория</label>
                            <select class="form-select" name="categoryId">
                                <option value="">Все категории</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.category}"
                                        th:selected="${param.categoryId != null && param.categoryId[0] == category.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Учреждение</label>
                            <select class="form-select" name="establishmentId">
                                <option value="">Все учреждения</option>
                                <option th:each="establishment : ${establishments}"
                                        th:value="${establishment.id}"
                                        th:text="${establishment.name}"
                                        th:selected="${param.establishmentId != null && param.establishmentId[0] == establishment.id.toString()}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                            <a th:href="@{/customer/services}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Сброс
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Список услуг -->
            <div class="row">
                <div th:each="service : ${services}" class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${service.name}">Название услуги</h5>
                            <p class="card-text" th:text="${service.description}">Описание услуги</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted" th:text="${service.price + ' руб.'}">0.00 руб.</span>
                                <a th:href="@{/customer/services/{id}/order(id=${service.id})}"
                                   class="btn btn-primary">
                                    <i class="bi bi-cart-plus"></i> Заказать
                                </a>
                            </div>
                        </div>
                        <div class="card-footer">
                            <small class="text-muted">
                                <i class="bi bi-building"></i>
                                <span th:text="${service.establishment.name}">Учреждение</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Пагинация -->
            <nav th:if="${services.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${services.first ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/customer/services(page=${services.number - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, services.totalPages - 1)}"
                        th:classappend="${services.number == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/customer/services(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${services.last ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/customer/services(page=${services.number + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
</div>
</body>
</html>
