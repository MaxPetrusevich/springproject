<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Просмотр плана подписки</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" th:text="${plan.name}">План подписки</h1>
                <div>
                    <a th:href="@{/organiser/subscription-plans/{id}/edit(id=${plan.id})}" 
                       class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Редактировать
                    </a>
                    <form th:action="@{/organiser/subscription-plans/{id}/toggle(id=${plan.id})}" 
                          method="post" style="display: inline;">
                        <button type="submit" class="btn" 
                                th:classappend="${plan.active ? 'btn-danger' : 'btn-success'}"
                                onclick="return confirm('Вы уверены?')">
                            <i class="bi" th:classappend="${plan.active ? 'bi-toggle-off' : 'bi-toggle-on'}"></i>
                            <span th:text="${plan.active ? 'Деактивировать' : 'Активировать'}"></span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Основная информация -->
                <div class="col-xl-4 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-4">Продукт</dt>
                                <dd class="col-sm-8">
                                    <a th:href="@{/organiser/products/{id}(id=${plan.productId})}" 
                                       th:text="${plan.productName}"></a>
                                </dd>

                                <dt class="col-sm-4">Статус</dt>
                                <dd class="col-sm-8">
                                    <span th:class="${'badge ' + (plan.active ? 'badge-success' : 'badge-danger')}"
                                          th:text="${plan.active ? 'Активен' : 'Неактивен'}">
                                    </span>
                                </dd>

                                <dt class="col-sm-4">Цена</dt>
                                <dd class="col-sm-8" th:text="${plan.price + ' ₽'}"></dd>

                                <dt class="col-sm-4">Период</dt>
                                <dd class="col-sm-8" th:text="${plan.periodDays + ' дней'}"></dd>

                                <dt class="col-sm-4">Описание</dt>
                                <dd class="col-sm-8" th:text="${plan.description}"></dd>

                                <dt class="col-sm-4">Создан</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(plan.createdAt, 'dd.MM.yyyy HH:mm')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="col-xl-8 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                        Всего подписок</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.totalSubscriptions}">0</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-card-list fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                        Активные подписки</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.activeSubscriptions}">0</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-card-checklist fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-info shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                                        Доход за месяц</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.monthlyRevenue + ' ₽'}">0 ₽</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-currency-dollar fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-warning shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                                        Коэффициент продления</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${#numbers.formatPercent(statistics.renewalRate, 1, 1)}">0%</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-arrow-repeat fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Дополнительная статистика -->
                            <div class="row mt-4">
                                <div class="col-md-6">
                                    <div class="card shadow">
                                        <div class="card-body">
                                            <h6 class="font-weight-bold">Статус подписок</h6>
                                            <div class="chart-pie pt-4">
                                                <canvas id="subscriptionStatusChart"></canvas>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card shadow">
                                        <div class="card-body">
                                            <h6 class="font-weight-bold">Динамика подписок</h6>
                                            <div class="chart-area">
                                                <canvas id="subscriptionTrendChart"></canvas>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Chart Scripts -->
    <script th:inline="javascript">
        // Данные для круговой диаграммы статусов подписок
        const statusData = {
            labels: ['Активные', 'Завершенные', 'Отмененные'],
            datasets: [{
                data: [
                    [[${statistics.activeSubscriptionsCount}]],
                    [[${statistics.completedSubscriptionsCount}]],
                    [[${statistics.canceledSubscriptionsCount}]]
                ],
                backgroundColor: ['#1cc88a', '#4e73df', '#e74a3b']
            }]
        };

        // Функция форматирования белорусских рублей
        function formatBYN(value) {
            return new Intl.NumberFormat('ru-BY', {
                style: 'currency',
                currency: 'BYN',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value);
        }

        // Настройка и отрисовка диаграмм
        document.addEventListener('DOMContentLoaded', function() {
            // Круговая диаграмма статусов
            new Chart(document.getElementById('subscriptionStatusChart'), {
                type: 'pie',
                data: statusData,
                options: {
                    maintainAspectRatio: false,
                    legend: {
                        display: true,
                        position: 'bottom'
                    },
                    tooltips: {
                        callbacks: {
                            label: function(tooltipItem, data) {
                                const dataset = data.datasets[tooltipItem.datasetIndex];
                                const total = dataset.data.reduce((acc, val) => acc + val, 0);
                                const value = dataset.data[tooltipItem.index];
                                const percentage = ((value / total) * 100).toFixed(1);
                                return `${data.labels[tooltipItem.index]}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
