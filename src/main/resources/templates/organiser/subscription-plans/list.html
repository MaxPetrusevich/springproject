<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Планы подписок</title>
</head>
<body>
    <th:block th:replace="layout/organiser :: layout(~{::section})">
        <section>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Планы подписок</h1>
                <a th:href="@{/organiser/subscription-plans/create}" class="btn btn-primary">
                    <i class="bi bi-plus"></i> Создать план
                </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск по названию...">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="productId">
                                <option value="">Все продукты</option>
                                <option th:each="prod : ${products}"
                                        th:value="${prod.id}"
                                        th:text="${prod.name}"
                                        th:selected="${prod.id == selectedProduct}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/organiser/subscription-plans}" class="btn btn-secondary w-100">
                                <i class="bi bi-x-circle"></i> Сбросить
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Plans List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Продукт</th>
                                    <th>Описание</th>
                                    <th>Цена</th>
                                    <th>Период (дней)</th>
                                    <th>Активные подписки</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="plan : ${plans}" th:id="'plan-' + ${plan.id}">
                                    <td>
                                        <a th:href="@{/organiser/subscription-plans/{id}(id=${plan.id})}" 
                                           th:text="${plan.name}"
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td>
                                        <a th:href="@{/organiser/products/{id}(id=${plan.productId})}" 
                                           th:text="${plan.productName}"
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td th:text="${plan.description}"></td>
                                    <td th:text="${plan.price + ' ₽'}"></td>
                                    <td th:text="${plan.periodDays}"></td>
                                    <td th:text="${plan.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span th:class="'badge ' + (${plan.active} ? 'bg-success' : 'bg-danger') + ' status-badge'"
                                              th:text="${plan.active ? 'Активен' : 'Неактивен'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/subscription-plans/{id}/edit(id=${plan.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <button type="button"
                                                    th:onclick="'togglePlanStatus(' + ${plan.id} + ')'"
                                                    th:class="'btn btn-sm ' + (${plan.active} ? 'btn-danger' : 'btn-success') + ' toggle-status-btn'"
                                                    th:text="${plan.active ? 'Деактивировать' : 'Активировать'}">
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(plans)}">
                                    <td colspan="8" class="text-center">Планы подписок не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <!-- Items per page -->
                        <div class="d-flex align-items-center">
                            <span class="me-2">Показывать по:</span>
                            <select class="form-select form-select-sm" style="width: auto"
                                    onchange="window.location.href=this.value">
                                <option th:each="size : ${#numbers.sequence(10, 100, 10)}"
                                        th:value="@{/organiser/subscription-plans(page=0, size=${size}, search=${search}, productId=${selectedProduct})}"
                                        th:text="${size}"
                                        th:selected="${plans.size == size}">
                                </option>
                            </select>
                        </div>

                        <!-- Page numbers -->
                        <nav>
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${plans.first ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/organiser/subscription-plans(page=${plans.number - 1}, size=${plans.size}, search=${search}, productId=${selectedProduct})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, plans.totalPages - 1)}"
                                    th:classappend="${i == plans.number ? 'active' : ''}">
                                    <a class="page-link" th:href="@{/organiser/subscription-plans(page=${i}, size=${plans.size}, search=${search}, productId=${selectedProduct})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${plans.last ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/organiser/subscription-plans(page=${plans.number + 1}, size=${plans.size}, search=${search}, productId=${selectedProduct})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Подключаем скрипты -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
            <script th:src="@{/js/admin/common.js(v=${#dates.createNow().getTime()})}"></script>
            <script th:src="@{/js/organiser/subscription-plans.js(v=${#dates.createNow().getTime()})}"></script>
        </section>
    </th:block>
</body>
</html>
