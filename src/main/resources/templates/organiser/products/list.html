<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Продукты</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::section})">
        <section>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Продукты</h1>
                <a th:href="@{/organiser/products/create}" class="btn btn-primary">
                    <i class="bi bi-plus"></i> Создать продукт
                </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск по названию...">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="organisationId">
                                <option value="">Все организации</option>
                                <option th:each="org : ${organisations}"
                                        th:value="${org.id}"
                                        th:text="${org.name}"
                                        th:selected="${org.id == selectedOrganisation}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/organiser/products}" class="btn btn-secondary w-100">
                                <i class="bi bi-x-circle"></i> Сбросить
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Организация</th>
                                    <th>Описание</th>
                                    <th>Планы подписок</th>
                                    <th>Активные подписки</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}" th:id="'product-' + ${product.id}">
                                    <td>
                                        <a th:href="@{/organiser/products/{id}(id=${product.id})}" 
                                           th:text="${product.name}"
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td>
                                        <a th:href="@{/organiser/organisations/{id}(id=${product.organisationId})}" 
                                           th:text="${product.organisationName}"
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td th:text="${product.description}"></td>
                                    <td th:text="${product.subscriptionPlansCount}"></td>
                                    <td th:text="${product.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${product.statusBadgeClass}"
                                              th:text="${product.statusText}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/products/{id}/edit(id=${product.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <button type="button"
                                                    th:onclick="'toggleProductStatus(' + ${product.id} + ')'"
                                                    th:class="${'btn btn-sm ' + (product.active ? 'btn-danger' : 'btn-success') + ' toggle-status-btn'}"
                                                    th:text="${product.active ? 'Деактивировать' : 'Активировать'}">
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="7" class="text-center">Продукты не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <!-- Items per page -->
                        <div class="d-flex align-items-center">
                            <span class="me-2">Показывать по:</span>
                            <select class="form-select form-select-sm" style="width: auto"
                                    onchange="window.location.href=this.value">
                                <option th:each="size : ${#numbers.sequence(10, 100, 10)}"
                                        th:value="@{/organiser/products(page=0, size=${size}, search=${search}, organisationId=${selectedOrganisation})}"
                                        th:text="${size}"
                                        th:selected="${products.size == size}">
                                </option>
                            </select>
                        </div>

                        <!-- Page numbers -->
                        <nav>
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${products.first ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/organiser/products(page=${products.number - 1}, size=${products.size}, search=${search}, organisationId=${selectedOrganisation})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                                    th:classappend="${i == products.number ? 'active' : ''}">
                                    <a class="page-link" th:href="@{/organiser/products(page=${i}, size=${products.size}, search=${search}, organisationId=${selectedOrganisation})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${products.last ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/organiser/products(page=${products.number + 1}, size=${products.size}, search=${search}, organisationId=${selectedOrganisation})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </div>
    
    <!-- Скрипты в конце body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin/common.js}"></script>
    <script th:src="@{/js/organiser/products.js}"></script>
</body>
</html>
