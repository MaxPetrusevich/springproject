    <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Просмотр продукта</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" th:text="${product.name}">Продукт</h1>
                <div>
                    <a th:href="@{/organiser/products/{id}/edit(id=${product.id})}" 
                       class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Редактировать
                    </a>
                    <form th:action="@{/organiser/products/{id}/toggle(id=${product.id})}" 
                          method="post" style="display: inline;">
                        <button type="submit" class="btn" 
                                th:classappend="${product.active ? 'btn-danger' : 'btn-success'}"
                                onclick="return confirm('Вы уверены?')">
                            <i class="bi" th:classappend="${product.active ? 'bi-toggle-off' : 'bi-toggle-on'}"></i>
                            <span th:text="${product.active ? 'Деактивировать' : 'Активировать'}"></span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Основная информация -->
                <div class="col-xl-4 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-4">Организация</dt>
                                <dd class="col-sm-8">
                                    <a th:href="@{/organiser/organisations/{id}(id=${product.organisationId})}" 
                                       th:text="${product.organisationName}"></a>
                                </dd>

                                <dt class="col-sm-4">Статус</dt>
                                <dd class="col-sm-8">
                                    <span th:class="${'badge ' + (product.active ? 'badge-success' : 'badge-danger')}"
                                          th:text="${product.active ? 'Активен' : 'Неактивен'}">
                                    </span>
                                </dd>

                                <dt class="col-sm-4">Описание</dt>
                                <dd class="col-sm-8" th:text="${product.description}"></dd>

                                <dt class="col-sm-4">Создан</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(product.createdAt, 'dd.MM.yyyy HH:mm')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="col-xl-8 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                        Планы подписок</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.subscriptionPlansCount}">0</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-list-check fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-4 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                        Активные подписки</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.activeSubscriptionsCount}">0</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-card-checklist fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-4 mb-4">
                                    <div class="card border-left-info shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                                        Доход за месяц</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                         th:text="${statistics.monthlyIncome + ' ₽'}">0 ₽</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-currency-dollar fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subscription Plans List -->
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Планы подписок</h6>
                    <a th:href="@{/organiser/subscription-plans/create(productId=${product.id})}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus"></i> Добавить план
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Цена</th>
                                    <th>Период (дней)</th>
                                    <th>Активные подписки</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="plan : ${subscriptionPlans}">
                                    <td th:text="${plan.name}"></td>
                                    <td th:text="${plan.description}"></td>
                                    <td th:text="${plan.price + ' ₽'}"></td>
                                    <td th:text="${plan.periodDays}"></td>
                                    <td th:text="${plan.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span th:class="${'badge ' + (plan.active ? 'badge-success' : 'badge-danger')}"
                                              th:text="${plan.active ? 'Активен' : 'Неактивен'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/subscription-plans/{id}/edit(id=${plan.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/organiser/subscription-plans/{id}/toggle(id=${plan.id})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-danger btn-sm" 
                                                        th:title="${plan.active ? 'Деактивировать' : 'Активировать'}"
                                                        onclick="return confirm('Вы уверены?')">
                                                    <i class="bi" th:classappend="${plan.active ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(subscriptionPlans)}">
                                    <td colspan="7" class="text-center">Планы подписок не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
