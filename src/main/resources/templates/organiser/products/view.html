<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Просмотр продукта</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::section})">
        <section>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <div>
                    <h1 class="h3 mb-0 text-gray-800" th:text="${product.name}">Продукт</h1>
                    <a th:href="@{/organiser/organisations/{id}(id=${product.organisationId})}" 
                       class="text-muted text-decoration-none">
                        <i class="bi bi-building"></i>
                        <span th:text="${product.organisationName}"></span>
                    </a>
                </div>
                <div class="btn-group">
                    <a th:href="@{/organiser/products/{id}/edit(id=${product.id})}" 
                       class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Редактировать
                    </a>
                    <a th:href="@{/organiser/products/{id}/subscription-plans/create(id=${product.id})}" 
                       class="btn btn-primary">
                        <i class="bi bi-plus"></i> Добавить план подписки
                    </a>
                </div>
            </div>

            <!-- Product Info -->
            <div class="row">
                <!-- Basic Info -->
                <div class="col-xl-4 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <p class="mb-2" th:text="${product.description}"></p>
                            <div class="small text-muted">
                                <div>Создан: <span th:text="${#temporals.format(product.createdAt, 'dd.MM.yyyy HH:mm')}"></span></div>
                                <div>Статус: 
                                    <span class="badge" th:classappend="${product.active ? 'bg-success' : 'bg-danger'}"
                                          th:text="${product.active ? 'Активен' : 'Неактивен'}">
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="col-xl-8 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                Коэффициент продления
                                            </div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                <span th:text="${#numbers.formatDecimal(statistics.renewalRate * 100, 1, 1)}"></span>%
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                Активные подписки
                                            </div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                                 th:text="${statistics.activeSubscriptions}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-info shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                                Месячный доход
                                            </div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                <span th:text="${#numbers.formatDecimal(statistics.monthlyRevenue, 0, 'WHITESPACE', 2, 'POINT')}"></span> ₽
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-warning shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                                Общий доход
                                            </div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                <span th:text="${#numbers.formatDecimal(statistics.totalRevenue, 0, 'WHITESPACE', 2, 'POINT')}"></span> ₽
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subscription Plans -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Планы подписок</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Цена</th>
                                    <th>Период (дней)</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="plan : ${subscriptionPlans}">
                                    <td>
                                        <a th:href="@{/organiser/subscription-plans/{id}(id=${plan.id})}"
                                           th:text="${plan.name}"
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td th:text="${plan.description}"></td>
                                    <td th:text="${plan.price + ' ₽'}"></td>
                                    <td th:text="${plan.periodDays}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${plan.active ? 'bg-success' : 'bg-danger'}"
                                              th:text="${plan.active ? 'Активен' : 'Неактивен'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/subscription-plans/{id}/edit(id=${plan.id})}"
                                               class="btn btn-warning btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(subscriptionPlans)}">
                                    <td colspan="6" class="text-center">Планы подписок не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
