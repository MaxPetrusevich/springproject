<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Мои организации</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Мои организации</h1>
                <a th:href="@{/organiser/organisations/create}" class="btn btn-primary">
                    <i class="bi bi-plus"></i> Создать организацию
                </a>
            </div>

            <!-- Organizations List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Продукты</th>
                                    <th>Подписчики</th>
                                    <th>Доход за месяц</th>
                                    <th>Общий доход</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="organ : ${organisations}">
                                    <td>
                                        <a th:href="@{/organiser/organisations/{id}(id=${organ.id})}" 
                                           th:text="${organ.name}">
                                            Название организации
                                        </a>
                                    </td>
                                    <td th:text="${organ.productsCount}">0</td>
                                    <td>
                                        <span th:text="${organ.activeSubscriptionsCount}">0</span>
                                        <small class="text-muted" th:text="'/ ' + ${organ.totalSubscriptionsCount}">/ 0</small>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(organ.monthlyIncome, 1, 2) + ' BYN'}">0.00 BYN</td>
                                    <td th:text="${#numbers.formatDecimal(organ.totalIncome, 1, 2) + ' BYN'}">0.00 BYN</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${organ.active ? 'bg-success' : 'bg-danger'}"
                                              th:text="${organ.active ? 'Активна' : 'Неактивна'}">
                                            Статус
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/organisations/{id}/edit(id=${organ.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/organiser/organisations/{id}/toggle(id=${organ.id})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm"
                                                        th:classappend="${organ.active ? 'btn-danger' : 'btn-success'}"
                                                        th:title="${organ.active ? 'Деактивировать' : 'Активировать'}"
                                                        onclick="return confirm('Вы уверены?')">
                                                    <i class="bi" th:classappend="${organ.active ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(organisations)}">
                                    <td colspan="7" class="text-center">Организации не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
