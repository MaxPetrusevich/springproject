<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Организации</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::section})">
        <section>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Организации</h1>
                <a th:href="@{/organiser/organisations/create}" class="btn btn-primary">
                    <i class="bi bi-plus"></i> Создать организацию
                </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Фильтры</h6>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="search" th:value="${search}" 
                                   placeholder="Поиск по названию...">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="active">
                                <option value="">Все статусы</option>
                                <option value="true" th:selected="${active == true}">Активные</option>
                                <option value="false" th:selected="${active == false}">Неактивные</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Поиск
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/organiser/organisations}" class="btn btn-secondary w-100">
                                <i class="bi bi-x-circle"></i> Сбросить
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Organizations List -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Продукты</th>
                                    <th>Активные подписки</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="organ : ${organisations}" th:id="'organisation-' + ${organ.id}">
                                    <td>
                                        <a th:href="@{/organiser/organisations/{id}(id=${organ.id})}" 
                                           th:text="${organ.name}" 
                                           class="text-decoration-none">
                                        </a>
                                    </td>
                                    <td th:text="${organ.description}"></td>
                                    <td th:text="${organ.productsCount}"></td>
                                    <td th:text="${organ.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${organ.active ? 'bg-success' : 'bg-danger'}"
                                              th:text="${organ.active ? 'Активна' : 'Неактивна'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/organisations/{id}/edit(id=${organ.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <button type="button"
                                                    th:onclick="'toggleOrganisationStatus(' + ${organ.id} + ')'"
                                                    th:class="${'btn btn-sm ' + (organ.active ? 'btn-danger' : 'btn-success') + ' toggle-status-btn'}"
                                                    th:text="${organ.active ? 'Деактивировать' : 'Активировать'}">
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(organisations)}">
                                    <td colspan="6" class="text-center">Организации не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-4">
                <!-- Items per page -->
                <div class="d-flex align-items-center">
                    <span class="me-2">Показывать по:</span>
                    <select class="form-select form-select-sm" style="width: auto"
                            onchange="window.location.href=this.value">
                        <option th:each="size : ${#numbers.sequence(10, 100, 10)}"
                                th:value="@{/organiser/organisations(page=0, size=${size}, search=${search}, active=${active})}"
                                th:text="${size}"
                                th:selected="${organisations.size == size}">
                        </option>
                    </select>
                </div>

                <!-- Page numbers -->
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${organisations.first ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/organiser/organisations(page=${organisations.number - 1}, size=${organisations.size}, search=${search}, active=${active})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, organisations.totalPages - 1)}"
                            th:classappend="${i == organisations.number ? 'active' : ''}">
                            <a class="page-link" th:href="@{/organiser/organisations(page=${i}, size=${organisations.size}, search=${search}, active=${active})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${organisations.last ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/organiser/organisations(page=${organisations.number + 1}, size=${organisations.size}, search=${search}, active=${active})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>
    </div>
    
    <!-- Скрипты в конце body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin/common.js}"></script>
    <script th:src="@{/js/organiser/organisations.js}"></script>
</body>
</html>
