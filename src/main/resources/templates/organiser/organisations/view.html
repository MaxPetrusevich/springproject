<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Просмотр организации</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800" th:text="${organisation.name}">Организация</h1>
                <div>
                    <a th:href="@{/organiser/organisations/{id}/edit(id=${organisation.id})}" 
                       class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Редактировать
                    </a>
                    <form th:action="@{/organiser/organisations/{id}/toggle(id=${organisation.id})}" 
                          method="post" style="display: inline;">
                        <button type="submit" class="btn" 
                                th:classappend="${organisation.active ? 'btn-danger' : 'btn-success'}"
                                onclick="return confirm('Вы уверены?')">
                            <i class="bi" th:classappend="${organisation.active ? 'bi-toggle-off' : 'bi-toggle-on'}"></i>
                            <span th:text="${organisation.active ? 'Деактивировать' : 'Активировать'}"></span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Основная информация -->
                <div class="col-xl-4 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Основная информация</h6>
                        </div>
                        <div class="card-body">
                            <dl class="row">
                                <dt class="col-sm-4">Название</dt>
                                <dd class="col-sm-8" th:text="${organisation.name}"></dd>

                                <dt class="col-sm-4">Описание</dt>
                                <dd class="col-sm-8" th:text="${organisation.description}"></dd>

                                <dt class="col-sm-4">Статус</dt>
                                <dd class="col-sm-8">
                                    <span class="badge" th:classappend="${organisation.active ? 'bg-success' : 'bg-danger'}"
                                          th:text="${organisation.active ? 'Активна' : 'Неактивна'}">
                                    </span>
                                </dd>

                                <dt class="col-sm-4">Дата создания</dt>
                                <dd class="col-sm-8" th:text="${#temporals.format(organisation.createdAt, 'dd.MM.yyyy HH:mm')}"></dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="col-xl-8 col-md-6 mb-4">
                    <div class="card shadow h-100">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Статистика</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <!-- Продукты -->
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                        Продукты</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                        <span th:text="${organisation.activeProductsCount}">0</span>
                                                        <small class="text-muted" th:text="'/ ' + ${organisation.productsCount}">/ 0</small>
                                                    </div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-box fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Планы подписок -->
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-info shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                                        Планы подписок</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                        <span th:text="${organisation.activeSubscriptionPlansCount}">0</span>
                                                        <small class="text-muted" th:text="'/ ' + ${organisation.subscriptionPlansCount}">/ 0</small>
                                                    </div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-list-check fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Подписки -->
                                <div class="col-md-3 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                        Подписки</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">
                                                        <span th:text="${organisation.activeSubscriptionsCount}">0</span>
                                                        <small class="text-muted" th:text="'/ ' + ${organisation.totalSubscriptionsCount}">/ 0</small>
                                                    </div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="bi bi-people fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products List -->
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Продукты</h6>
                    <a th:href="@{/organiser/products/create(organisationId=${organisation.id})}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus"></i> Добавить продукт
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Планы подписок</th>
                                    <th>Активные подписки</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td>
                                        <a th:href="@{/organiser/products/{id}(id=${product.id})}" 
                                           th:text="${product.name}">
                                        </a>
                                    </td>
                                    <td th:text="${product.description}"></td>
                                    <td th:text="${product.subscriptionPlansCount}"></td>
                                    <td th:text="${product.activeSubscriptionsCount}"></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${product.active ? 'bg-success' : 'bg-danger'}"
                                              th:text="${product.active ? 'Активен' : 'Неактивен'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/organiser/products/{id}/edit(id=${product.id})}" 
                                               class="btn btn-warning btn-sm" title="Редактировать">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="6" class="text-center">Продукты не найдены</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
