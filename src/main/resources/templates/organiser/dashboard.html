<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/organiser :: head">
    <title>Панель управления</title>
</head>
<body>
    <div th:replace="layout/organiser :: layout(~{::main})">
        <main>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Панель управления</h1>
            </div>

            <!-- Content Row -->
            <div class="row">
                <!-- Общий доход -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Общий доход</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                         th:text="${#numbers.formatDecimal(statistics.totalRevenue, 1, 2) + ' BYN'}">0 BYN</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-currency-dollar fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Доход за месяц -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-success shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                        Доход за месяц</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                         th:text="${#numbers.formatDecimal(statistics.monthlyRevenue, 1, 2) + ' BYN'}">0 BYN</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-graph-up fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Активные подписки -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-info shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                        Активные подписки</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                         th:text="${statistics.activeSubscriptionsCount}">0</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-people fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Коэффициент продления -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-warning shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                        Коэффициент продления</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" 
                                         th:text="${#numbers.formatPercent(statistics.renewalRate, 1, 1)}">0%</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-arrow-repeat fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Список организаций -->
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Ваши организации</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">

                            <tbody>
                                <div class="card mb-4" th:each="organisation : ${organisations}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h5 class="card-title mb-0" th:text="${organisation.name}">Название организации</h5>
                                            <span class="badge" 
                                                  th:classappend="${organisation.active ? 'bg-success' : 'bg-danger'}"
                                                  th:text="${organisation.active ? 'Активна' : 'Неактивна'}">
                                            </span>
                                        </div>
                                        <!-- остальное содержимое карточки -->
                                    </div>
                                </div>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
