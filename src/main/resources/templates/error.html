<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Произошла ошибка
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Статус ошибки -->
                    <div class="alert alert-danger mb-4">
                        <h5 class="alert-heading">
                            <span th:text="${status != null ? status : 'Неизвестная ошибка'}">500</span>
                            <span th:text="${error != null ? ' - ' + error : ''}">Internal Server Error</span>
                        </h5>
                    </div>

                    <!-- Детали ошибки -->
                    <div class="mb-4">
                        <h6 class="text-muted mb-3">Детали ошибки:</h6>
                        <ul class="list-group">
                            <li class="list-group-item">
                                <strong>Сообщение:</strong>
                                <span th:text="${message != null ? message : 'Нет сообщения'}">Произошла ошибка</span>
                            </li>
                            <li class="list-group-item">
                                <strong>Время:</strong>
                                <span th:with="formattedDate=${
                                    timestamp != null ? 
                                        (timestamp instanceof T(java.time.LocalDateTime) ? 
                                            #temporals.format(timestamp, 'dd.MM.yyyy HH:mm:ss') : 
                                            #dates.format(timestamp, 'dd.MM.yyyy HH:mm:ss')
                                        ) : 'Неизвестно'}"
                                      th:text="${formattedDate}">
                                    01.01.2024 12:00:00
                                </span>
                            </li>
                            <li class="list-group-item">
                                <strong>URL:</strong>
                                <span th:text="${path != null ? path : 'Неизвестно'}">/error</span>
                            </li>
                            <li class="list-group-item" th:if="${exception != null}">
                                <strong>Исключение:</strong>
                                <span th:text="${exception}">Exception details</span>
                            </li>
                            <li class="list-group-item" th:if="${trace != null}">
                                <strong>Стек вызовов:</strong>
                                <pre class="mt-2"><code th:text="${trace}">Stack trace</code></pre>
                            </li>
                        </ul>
                    </div>

                    <!-- Кнопки -->
                    <div class="d-flex gap-2">
                        <a href="javascript:history.back()" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>
                            Назад
                        </a>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-fill me-2"></i>
                            На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
